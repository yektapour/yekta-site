<script>
(function(){
  const stage = document.getElementById('stage');
  const field = document.getElementById('field');
  const canvas = document.getElementById('gl');
  const ring = document.getElementById('ring');
  const ringProgress = document.getElementById('ringProgress');
  const btnAudio = document.getElementById('btnAudio');
  const btnVideo = document.getElementById('btnVideo');
  const resetDot = document.getElementById('resetDot');
  const themeDot = document.getElementById('themeDot');
  const fileInput = document.getElementById('fileInput');

  // ================= scene =================
  // Plain 2D canvas: the particle positions are computed here anyway, so
  // they are simply projected with a perspective camera and drawn as small
  // squares - no 3D library needed.
  const g2 = canvas.getContext('2d');
  const CAM_Z = 6.2, BASE_FOV = 30;
  let dpr = 1, cw = 0, ch = 0;
  let dotRGB = [10,10,10];

  // ================= edition =================
  // PLAY_MODE (set by the build): the NFT edition plays sound and film inside
  // the work instead of saving files (marketplace viewers block downloads).
  const PLAY_MODE = false;

  // ================= particles =================
  const COUNT = 9000;
  const R = 1.05;
  const SMALL_R = R * 0.5;      // exactly half the radius
  const OFFSET_X = 1.0;         // centre distance of each small sphere from the middle

  const positions = new Float32Array(COUNT*3);
  const basePos   = new Float32Array(COUNT*3);  // on the big sphere
  const dstLocal  = new Float32Array(COUNT*3);  // relative to its own small-sphere centre
  const cxArr     = new Float32Array(COUNT);    // centre x of the sphere it will join
  const hArr      = new Float32Array(COUNT);    // +1 = top half (arcs up, goes left) / -1 = bottom half
  const delayArr  = new Float32Array(COUNT);    // 0..1, when it leaves relative to others
  const zbArr     = new Float32Array(COUNT);    // depth drift during flight
  const wob       = new Float32Array(COUNT*3);  // organic wobble direction
  const NB = 24;
  const bandArr   = new Uint8Array(COUNT);      // left sphere as a spherical equaliser: band by latitude

  for(let i=0;i<COUNT;i++){
    // polar angle uniform in [0,PI] -> denser near poles (matches the reference)
    const theta = Math.random()*Math.PI;
    const phi   = Math.random()*Math.PI*2;
    const r     = R*(0.965 + Math.random()*0.05);
    const i3 = i*3;
    basePos[i3]   = r*Math.sin(theta)*Math.cos(phi);
    basePos[i3+1] = r*Math.cos(theta);
    basePos[i3+2] = r*Math.sin(theta)*Math.sin(phi);

    // Each half "unfolds" into a complete small sphere: the half's polar
    // range [0,PI/2] (or [PI/2,PI]) is stretched to [0,PI], azimuth kept.
    // Uniform-in-theta stays uniform-in-theta, so the small spheres inherit
    // exactly the same pole-dense pattern as the big one, with a coherent
    // (non-random) flow instead of particles criss-crossing.
    const top = theta < Math.PI/2;
    const th2 = top ? theta*2 : theta*2 - Math.PI;
    bandArr[i] = Math.min(NB-1, Math.floor((1 - th2/Math.PI)*NB));   // bottom = low, top = high
    const r2  = r*0.5;
    dstLocal[i3]   = r2*Math.sin(th2)*Math.cos(phi);
    dstLocal[i3+1] = r2*Math.cos(th2);
    dstLocal[i3+2] = r2*Math.sin(th2)*Math.sin(phi);

    cxArr[i] = top ? -OFFSET_X : OFFSET_X;
    hArr[i]  = top ? 1 : -1;

    // equator leaves first, poles last; azimuth + noise break the symmetry
    delayArr[i] = 0.5*Math.abs(Math.cos(theta)) + 0.3*(phi/(Math.PI*2)) + 0.2*Math.random();
    zbArr[i] = (Math.random()-0.5)*0.7;
    wob[i3]=Math.random()*2-1; wob[i3+1]=Math.random()*2-1; wob[i3+2]=Math.random()*2-1;

    positions[i3]=basePos[i3]; positions[i3+1]=basePos[i3+1]; positions[i3+2]=basePos[i3+2];
  }

  const DOT_SIZE = 0.024;

  function drawParticles(pos, size){
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    g2.clearRect(0, 0, cw, ch);
    g2.globalAlpha = 0.82;
    g2.fillStyle = 'rgb(' + dotRGB[0] + ',' + dotRGB[1] + ',' + dotRGB[2] + ')';
    const cx = cw/2, cy = ch/2, half = ch/2;
    for(let i=0;i<COUNT;i++){
      const i3 = i*3, depth = CAM_Z - pos[i3+2];
      const k = pxPerUnit*CAM_Z/depth, sz = size*half/depth;
      g2.fillRect(cx + pos[i3]*k - sz/2, cy - pos[i3+1]*k - sz/2, sz, sz);
    }
    g2.globalAlpha = 1;
  }

  // ================= sizing =================
  let pxPerUnit = 150;
  function resize(){
    const fw = field.clientWidth, fh = field.clientHeight;
    pxPerUnit = fh / (2*CAM_Z*Math.tan(BASE_FOV*Math.PI/360));
    cw = fw*2.4; ch = fh*1.7;
    canvas.style.width  = cw+'px';
    canvas.style.height = ch+'px';
    canvas.style.left = (-(cw-fw)/2)+'px';
    canvas.style.top  = (-(ch-fh)/2)+'px';
    dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = Math.round(cw*dpr); canvas.height = Math.round(ch*dpr);
    layoutIcons();
  }

  // icons are placed from the real projected sphere positions
  function layoutIcons(){
    const fw = field.clientWidth, fh = field.clientHeight;
    const cx = fw/2, cy = fh/2;
    const yIcon = cy + SMALL_R*1.04*pxPerUnit + Math.max(30, fh*0.085);
    btnAudio.style.left = (cx - OFFSET_X*pxPerUnit)+'px';
    btnVideo.style.left = (cx + OFFSET_X*pxPerUnit)+'px';
    btnAudio.style.top = btnVideo.style.top = yIcon+'px';
  }

  window.addEventListener('resize', resize);
  resize();

  // ================= animation =================
  let time = 0, A = 0;               // A = shared rotation angle of every sphere
  let energy = 1, targetEnergy = 1;
  let T = 0, Tdir = 0;               // T: 0 = one sphere ... 1 = two spheres
  const SPLIT_MS = 4600, MERGE_MS = 4600;   // reverse takes exactly as long as the forward motion
  const MAXD = 0.5;                  // spread of departure times
  const ARC = 0.55, SWIRL = 1.3, WOB = 0.09;
  let last = performance.now();
  let shock = 0, shockT0 = 0;
  // sound analysis for the equaliser sphere
  let analyser = null, freqBuf = null, bandBins = null, audioOn = false, audioViz = 0;
  const EQ = new Float32Array(NB);
  function updateEQ(){
    if(analyser && audioOn){
      analyser.getByteFrequencyData(freqBuf);
      for(let k=0;k<NB;k++){
        let m = 0; for(let j=bandBins[k]; j<bandBins[k+1]; j++) if(freqBuf[j] > m) m = freqBuf[j];
        const v = Math.pow(m/255, 1.8);
        EQ[k] += (v - EQ[k])*(v > EQ[k] ? 0.45 : 0.12);       // quick to open, slow to close
      }
    } else for(let k=0;k<NB;k++) EQ[k] *= 0.9;
  }

  function sm5(x){ return x*x*x*(x*(x*6-15)+10); }

  function tick(){
    const now = performance.now();
    const dt = Math.min(now-last, 50); last = now;

    time += 0.012;
    energy += (targetEnergy-energy)*0.04;
    A += 0.0032*energy;              // identical spin for big and small spheres

    if(Tdir>0){
      T += dt/SPLIT_MS;
      if(T>=1){ T=1; Tdir=0; onSplitDone(); }
    } else if(Tdir<0){
      T -= dt/MERGE_MS;
      if(T<=0){ T=0; Tdir=0; onMergeDone(); }
    }

    const pos = positions;
    const b = 1 + Math.sin(time*0.6)*0.01*energy;   // same gentle breathing everywhere
    updateEQ();
    audioViz += ((audioOn ? 1 : 0) - audioViz)*0.05;
    const cA = Math.cos(A), sA = Math.sin(A);

    for(let i=0;i<COUNT;i++){
      const i3 = i*3;
      let s = 0;
      if(T>0){
        let lp = (T - delayArr[i]*MAXD)/(1-MAXD);
        lp = lp<0 ? 0 : (lp>1 ? 1 : lp);
        s = sm5(lp);
      }
      const bulge = Math.sin(Math.PI*s);

      let cs = cA, sn = sA;
      if(bulge>0.0001){
        const ang = A + hArr[i]*SWIRL*bulge;      // departing particles orbit the axis
        cs = Math.cos(ang); sn = Math.sin(ang);
      }
      const sx = basePos[i3]*b, sy = basePos[i3+1]*b, sz = basePos[i3+2]*b;
      const rsx = sx*cs + sz*sn, rsz = -sx*sn + sz*cs;

      const dx = dstLocal[i3]*b, dy = dstLocal[i3+1]*b, dz = dstLocal[i3+2]*b;
      const px = cxArr[i] + dx*cA + dz*sA, pz = -dx*sA + dz*cA;

      let x = rsx + (px-rsx)*s;
      let y = sy  + (dy-sy)*s;
      let z = rsz + (pz-rsz)*s;
      if(bulge>0){
        y += hArr[i]*ARC*bulge;
        z += zbArr[i]*bulge;
        x += wob[i3]*WOB*bulge; y += wob[i3+1]*WOB*bulge; z += wob[i3+2]*WOB*bulge;
      }
      if(shock > 0){                                  // error: particles burst outward and settle back
        x += (x*0.32 + wob[i3]*0.22)*shock; y += (y*0.32 + wob[i3+1]*0.22)*shock; z += wob[i3+2]*0.2*shock;
      }
      if(audioViz > 0.002 && hArr[i] > 0 && s >= 1){       // the sound's sphere opens and closes with its own bands
        const e = EQ[bandArr[i]]*audioViz, cx = cxArr[i], k = 1 + 0.12*e, w = 0.015*e;
        x = cx + (x - cx)*k + wob[i3]*w; y = y*k + wob[i3+1]*w; z = z*k + wob[i3+2]*w;
      }
      pos[i3]=x; pos[i3+1]=y; pos[i3+2]=z;
    }

    if(shockT0){                                     // quick burst out, slow settle back
      const k = (now - shockT0)/1500;
      if(k >= 1){ shockT0 = 0; shock = 0; }
      else shock = k < 0.18 ? Math.sin(Math.PI/2 * k/0.18) : Math.pow(1 - (k-0.18)/0.82, 2);
    }

    // half the radius, half the particles each -> same ink density needs dots ~0.71x
    drawParticles(pos, DOT_SIZE*(1 - 0.29*sm5(T)));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ================= interaction =================
  let state = 'idle';

  function hitTest(cx, cy){
    const r = field.getBoundingClientRect();
    const x = cx-(r.left+r.width/2), y = cy-(r.top+r.height/2);
    if(T<0.5){
      const rad = R*pxPerUnit*1.12;
      return x*x+y*y <= rad*rad;
    }
    const rad = SMALL_R*pxPerUnit*1.3, ox = OFFSET_X*pxPerUnit;
    return ((x-ox)*(x-ox)+y*y <= rad*rad) || ((x+ox)*(x+ox)+y*y <= rad*rad);
  }

  function uploadable(){ return state==='idle'; }

  // iPhones only allow sound that starts inside a user's tap. The tap that
  // opens the file picker unlocks one audio context, kept for later use by
  // the live-recording fallback, so that step can never wait forever.
  let sharedAC = null;
  function unlockAudio(){
    try{
      if(!sharedAC){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        sharedAC = new AC();
      }
      if(sharedAC.state !== 'running') sharedAC.resume();
      const b = sharedAC.createBuffer(1, 1, 22050), s = sharedAC.createBufferSource();
      s.buffer = b; s.connect(sharedAC.destination); s.start(0);
    }catch(e){}
  }
  function openPicker(){ unlockAudio(); fileInput.value = ''; fileInput.click(); }
  stage.addEventListener('pointermove', (e)=>{
    stage.style.cursor = (uploadable() && hitTest(e.clientX,e.clientY)) ? 'pointer' : 'default';
  });
  stage.addEventListener('click', (e)=>{
    if(!uploadable() || !hitTest(e.clientX,e.clientY)) return;
    openPicker();
  });

  let current = null;        // { style, id, mp3, video:{blob,ext} }

  // ---------- hidden diagnostics: long-press the top dot ----------
  const DIAG = { on:false, el:null, info:{}, errors:[], t0:0 };
  function feat(){
    const yes = b => b ? 'yes' : 'NO';
    let mp4rec = false; try{ mp4rec = !!(window.MediaRecorder && MediaRecorder.isTypeSupported('video/mp4')); }catch(e){}
    return 'worker ' + yes(typeof Worker!=='undefined') + ' | offscreen ' + yes(typeof OffscreenCanvas!=='undefined') +
           ' | videoEnc ' + yes(typeof VideoEncoder!=='undefined') + ' | audioEnc ' + yes(typeof AudioEncoder!=='undefined') +
           ' | wasm ' + yes(typeof WebAssembly!=='undefined') + ' | rec-mp4 ' + yes(mp4rec);
  }
  function dset(k, v){ DIAG.info[k] = v; drender(); }
  function derr(m){ DIAG.errors.push(String(m).slice(0, 160)); if(DIAG.errors.length > 6) DIAG.errors.shift(); drender(); }
  function drender(){
    if(!DIAG.on) return;
    if(!DIAG.el){
      DIAG.el = document.createElement('div');
      DIAG.el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;'+
        'color:var(--dot);opacity:.75;white-space:pre-wrap;pointer-events:none;z-index:9;direction:ltr;text-align:left;';
      document.body.appendChild(DIAG.el);
    }
    const lines = [feat(), 'screen ' + screen.width + 'x' + screen.height + ' dpr ' + (window.devicePixelRatio||1) + ' | phone ' + isPhone + ' | maxW ' + MAX_VIDEO_W];
    for(const k in DIAG.info) lines.push(k + ': ' + DIAG.info[k]);
    if(DIAG.errors.length) lines.push('errors:\n  ' + DIAG.errors.join('\n  '));
    DIAG.el.textContent = lines.join('\n');
  }
  window.addEventListener('error', e => derr('page: ' + (e.message || e.type)));
  window.addEventListener('unhandledrejection', e => derr('promise: ' + (e.reason && e.reason.message || e.reason)));
  setInterval(()=>{ if(DIAG.on && state==='processing') dset('elapsed', ((performance.now()-DIAG.t0)/1000).toFixed(0) + ' s'); }, 1000);

  // Published inside the Claude viewer, a page must hand files over through
  // the viewer's downloads capability; anywhere else (e.g. once minted),
  // a plain link download is used.
  const downloadsP = (window.claude && typeof window.claude.use === 'function')
    ? Promise.resolve(window.claude.use('downloads')).catch(()=>null)
    : Promise.resolve(null);

  fileInput.addEventListener('change', (e)=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    startProcessing(f);
  });

  const CIRC = 2*Math.PI*130;
  // The ring follows the real progress. Between progress reports it may
  // creep forward a little (so it never looks frozen), but never more than
  // 2.5% ahead of the real value, never past the current stage, and it can
  // only close completely when both files are actually ready.
  let shownP = 0, targetP = 0, realP = 0, stageEnd = 0, ringRaf = 0, allDone = false;
  const RING_HOLD = 0.985;
  function ringLoop(){
    if(!allDone){
      const cap = Math.min(stageEnd - 0.002, realP + 0.025, RING_HOLD);
      if(targetP < cap) targetP += (cap - targetP)*0.01;
    }
    shownP += (targetP - shownP)*0.06;
    if(targetP - shownP < 0.0015) shownP = Math.max(shownP, targetP - 0.0015);
    ringProgress.setAttribute('stroke-dashoffset', CIRC*(1-Math.min(1, shownP)));
    ringRaf = requestAnimationFrame(ringLoop);
  }
  // stage boundaries weighted by real time: the video is most of the work
  const MILESTONES = [0.03, 0.04, 0.10, 0.16, 1];
  function onProgress(p){
    dset('progress', (p*100).toFixed(1) + '%  ' + (p < 0.03 ? 'decoding' : p < 0.04 ? 'analysing' : p < 0.10 ? 'synthesising' : p < 0.16 ? 'mp3' : p < 1 ? 'video' : 'done'));
    realP = Math.max(realP, p);
    targetP = Math.max(targetP, Math.min(allDone ? 1 : RING_HOLD, p));
    stageEnd = MILESTONES.find(m => m > p + 1e-6) || 1;
  }

  // ---------- background worker, built from the scripts already on the page ----------
  const LIB_IDS = ['lib-jpeg','lib-fflate','lib-wme','lib-mp3wasm','lib-lame','lib-mux','engine'];
  const isPhone = (window.matchMedia && matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 820)
                  || (navigator.deviceMemory && navigator.deviceMemory <= 4);
  const MAX_VIDEO_W = isPhone ? 720 : 1080;
  const STALL_MS = 75000;                 // no progress for this long = stuck
  const WORKER_GLUE = `
self.onmessage = async (ev) => {
  const m = ev.data, E = SonificationEngine;
  const emit = p => self.postMessage({ type:'progress', p });
  try{
    if(m.cmd === 'run'){
      const out = await E.run(new Uint8Array(m.bytes), m.mime, emit,
        { maxVideoWidth: m.maxVideoWidth, onAudio: a => self.postMessage({ type:'audio', a }) });
      const transfer = [];
      if(out.pcmL) transfer.push(out.pcmL.buffer, out.pcmR.buffer);
      if(out.image) transfer.push(out.image.data.buffer);
      self.postMessage({ type:'done', out }, transfer);
    } else if(m.cmd === 'prepare'){
      const out = await E.prepareJob(new Uint8Array(m.bytes), m.mime, emit, { maxVideoWidth: m.maxVideoWidth });
      const tr = [out.L.buffer, out.R.buffer, out.videoBase.buffer];
      for(const k of ['eq','peaks','rms','hx','hy','hr','hi']) if(out.pre[k]) tr.push(out.pre[k].buffer);
      self.postMessage({ type:'done', out }, tr);
    } else if(m.cmd === 'audio'){
      const out = await E.audioJob(m.L, m.R, m.sampleRate, m.enc, emit, { noMp3: m.noMp3 });
      self.postMessage({ type:'done', out }, out.track.chunks.map(ch => ch.data));
    } else if(m.cmd === 'segment'){
      const out = await E.segmentJob(m.job, emit, r => self.postMessage({ type:'probe', r }));
      self.postMessage({ type:'done', out }, out.chunks.map(ch => ch.data));
    }
  }catch(err){
    self.postMessage({ type:'failed', message:String(err && err.message || err) });
  }
};`;
  function runInWorker(bytes, mime){
    return new Promise((resolve, reject)=>{
      let w, url;
      try{
        const src = LIB_IDS.map(id => { const el = document.getElementById(id); return el ? el.textContent : ''; }).join('\n;\n');
        url = URL.createObjectURL(new Blob([src, '\n;\n', WORKER_GLUE], { type:'text/javascript' }));
        w = new Worker(url);
      }catch(err){ reject({ infra:true, err }); return; }
      let partial = null, lastTick = performance.now(), finished = false;
      const end = ()=>{ finished = true; clearInterval(dog); try{ w.terminate(); }catch(e){} URL.revokeObjectURL(url); };
      // watchdog: a worker that stops reporting (crashed, out of memory, an
      // encoder that never answers) is abandoned; whatever is ready is used
      const dog = setInterval(()=>{
        if(finished || performance.now() - lastTick < STALL_MS) return;
        end();
        derr('watchdog: no progress for ' + (STALL_MS/1000) + ' s');
        if(partial) resolve(Object.assign({}, partial, { video:null }));
        else reject({ infra:false, err:new Error('stalled') });
      }, 3000);
      w.onmessage = ev => {
        const m = ev.data;
        lastTick = performance.now();
        if(m.type === 'progress') onProgress(m.p);
        else if(m.type === 'audio'){ partial = m.a; dset('audio', 'ready (' + (m.a.mp3Encoder||'') + ')'); }
        else if(m.type === 'done'){ end(); resolve(m.out); }
        else { derr('worker: ' + m.message); end(); reject({ infra:false, err:new Error(m.message) }); }   // the image itself failed
      };
      w.onerror = ev => {
        derr('worker crashed: ' + (ev.message || 'unknown'));
        if(ev.preventDefault) ev.preventDefault(); end();
        if(partial) resolve(Object.assign({}, partial, { video:null }));   // audio was already made
        else reject({ infra:true, err:ev });
      };
      const copy = bytes.slice();
      w.postMessage({ cmd:'run', bytes:copy.buffer, mime, maxVideoWidth:MAX_VIDEO_W }, [copy.buffer]);
    });
  }

  // ---------- parallel pipeline ----------
  function makeWorker(){
    const src = LIB_IDS.map(id => { const el = document.getElementById(id); return el ? el.textContent : ''; }).join('\n;\n');
    const url = URL.createObjectURL(new Blob([src, '\n;\n', WORKER_GLUE], { type:'text/javascript' }));
    const w = new Worker(url);
    return { w, url };
  }
  // one job in its own worker; rejects with {infra:true} when the worker
  // itself cannot run, {infra:false} when the job failed, and on stalls
  const activeJobs = new Set();
  function stopAllJobs(){ for(const stop of [...activeJobs]) stop(); }    // free every core at once
  function workerJob(msg, transfer, onProg, onProbe, registry){
    return new Promise((resolve, reject)=>{
      let h;
      try{ h = makeWorker(); }catch(err){ reject({ infra:true, err }); return; }
      let last = performance.now(), finished = false;
      const end = ()=>{ finished = true; activeJobs.delete(stop); clearInterval(dog); try{ h.w.terminate(); }catch(e){} URL.revokeObjectURL(h.url); };
      const stop = ()=>{ if(!finished){ end(); reject({ infra:false, err:new Error('stopped'), stopped:true }); } };
      activeJobs.add(stop);
      if(registry) registry.push(stop);
      const dog = setInterval(()=>{ if(!finished && performance.now()-last > STALL_MS){ end(); derr('watchdog: ' + msg.cmd + ' stalled'); reject({ infra:false, err:new Error('stalled') }); } }, 3000);
      h.w.onmessage = ev => {
        const m = ev.data; last = performance.now();
        if(m.type === 'progress'){ if(onProg) onProg(m.p); }
        else if(m.type === 'probe'){ if(onProbe) onProbe(m.r); }
        else if(m.type === 'done'){ end(); resolve(m.out); }
        else if(m.type === 'failed'){ end(); derr(msg.cmd + ': ' + m.message); reject({ infra:false, err:new Error(m.message) }); }
      };
      h.w.onerror = ev => { if(ev.preventDefault) ev.preventDefault(); end(); derr(msg.cmd + ' worker crashed: ' + (ev.message||'')); reject({ infra:true, err:ev }); };
      h.w.postMessage(msg, transfer || []);
    });
  }

  async function runParallel(file){
    const T = ()=>performance.now();
    let t = T();
    const bytes = new Uint8Array(await file.arrayBuffer());
    dset('file', (file.type || '?') + ' ' + (bytes.length/1048576).toFixed(1) + ' MB');
    const copy = bytes.slice();
    const prep = await workerJob({ cmd:'prepare', bytes:copy.buffer, mime:file.type, maxVideoWidth:MAX_VIDEO_W }, [copy.buffer], onProgress);
    dset('t prepare', ((T()-t)/1000).toFixed(1) + ' s');
    t = T();

    const nF = prep.pre.nF, FPS = prep.FPS;
    const hw = prep.vcfg.hardwareAcceleration === 'prefer-hardware';
    const cores = navigator.hardwareConcurrency || 2;
    let K = hw ? 2 : Math.max(1, Math.min(4, cores - 1));
    if(window.__forceSegments) K = window.__forceSegments;              // (tests only)
    K = Math.max(1, Math.min(K, Math.floor(nF/(FPS*4)) || 1));           // segments of at least 4 s
    dset('path', 'parallel: ' + K + ' video worker' + (K>1?'s':'') + ' + audio worker | encoder ' + (hw ? 'hardware' : 'software') + ' | cores ' + cores);

    // Adaptive: every attempt is measured after ~4 s of video. Too big for
    // 20 MB -> lower the bitrate (or, if the encoder ignores bitrate, the size);
    // too slow for this device -> a smaller frame size. Only the few seconds
    // of measuring are repeated; the audio keeps running meanwhile.
    const MAX_B = SonificationEngine.MAX_VIDEO_BYTES, TIME_TARGET = 90;
    const TIERS = [720, 540, 400].filter(w => w <= Math.max(prep.dims.VW, 400));
    let tier = 0, enc = Object.assign({}, prep.enc), dims = prep.dims, vcfg = prep.vcfg;
    const baseRate = prep.enc.bitrate; let factor = 1, corrected = false;
    const ranges = [];
    for(let k=0;k<K;k++) ranges.push([Math.round(k*nF/K), Math.round((k+1)*nF/K)]);
    const audioP = workerJob({ cmd:'audio', L:prep.L, R:prep.R, sampleRate:prep.sampleRate, enc:prep.enc, noMp3:PLAY_MODE },
                             [prep.L.buffer, prep.R.buffer], null)
                   .then(a => { dset('t audio', ((T()-t)/1000).toFixed(1) + ' s (in parallel)'); dset('audio', 'ready (' + a.mp3Encoder + ')'); return a; });
    audioP.catch(()=>{});

    async function attempt(){
      const done = new Array(K).fill(0), probes = [], stops = [];
      const segProgress = ()=> onProgress(0.16 + 0.84*done.reduce((a,b)=>a+b, 0)/nF);
      let decided = null, decide;
      const decision = new Promise(r => decide = r);
      const onProbe = r => {
        probes.push(r);
        if(probes.length < K || decided) return;
        const over = Math.max(...probes.map(p => p.overshoot));
        const eta = Math.max(...probes.map(p => p.msPerFrame*p.framesLeft))/1000;
        dset('probe ' + dims.VW + 'px', 'encoder rate x' + over.toFixed(2) + ', video time ' + eta.toFixed(0) + ' s');
        if(over > 1.25 && !corrected){                          // encoder overshoots: ask for proportionally less
          // the overshoot is the encoder's own property: set the factor once, never compound it
          corrected = true; factor = Math.max(factor, over*1.05);
          decided = { tier, enc: Object.assign({}, enc, { bitrate: Math.floor(baseRate/factor) }) };
        } else if(eta > TIME_TARGET && tier < TIERS.length-1){
          decided = { tier: tier+1 };
        }
        if(decided){ stops.forEach(s => s()); decide(decided); }
      };
      const segsP = Promise.all(ranges.map(([f0,f1], k)=>
        workerJob({ cmd:'segment', job:{ pre:prep.pre, events:prep.events, dims, FPS, vcfg, enc, videoBase:prep.videoBase,
                                          baseW:prep.dims.VW, baseH:prep.dims.IH, f0, f1 } }, [],
                  p=>{ done[k] = p*(f1-f0); segProgress(); }, onProbe, stops)));
      segsP.catch(()=>{});
      const res = await Promise.race([segsP.then(s => ({ segs:s })), decision.then(d => ({ restart:d }))]).catch(e => {
        if(decided) return { restart: decided }; throw e; });
      return res;
    }

    let segs = null;
    for(let tries=0; tries<6 && !segs; tries++){
      const r = await attempt();
      if(r.segs){ segs = r.segs; break; }
      if(r.restart.tier !== undefined && r.restart.tier !== tier){
        tier = r.restart.tier; corrected = false;
        dims = SonificationEngine.videoDims({ w:prep.dims.VW, h:prep.dims.IH }, TIERS[tier]);
        enc = Object.assign({}, prep.enc, { bitrate: Math.floor(baseRate/factor) });   // keep any overshoot correction
        vcfg = await SonificationEngine.pickVideoConfig(dims, FPS, enc);
        if(!vcfg) throw new Error('no encoder for ' + dims.VW + 'px');
      } else {
        enc = r.restart.enc;
        vcfg = Object.assign({}, vcfg, { bitrate: enc.bitrate });
      }
      dset('adapt', dims.VW + 'px, ' + Math.round(enc.bitrate/1000) + ' kbps');
    }
    if(!segs) throw new Error('could not adapt');
    const audio = await audioP;
    let blob = SonificationEngine.muxParallel(dims, FPS, audio.track, segs);
    // final guarantee: the real size is checked; if still over, rebuilt once proportionally
    if(blob.size > MAX_B){
      dset('size check', (blob.size/1e6).toFixed(2) + ' MB > 20, rebuilding once');
      enc = Object.assign({}, enc, { bitrate: Math.floor(enc.bitrate*MAX_B*0.92/blob.size) });
      vcfg = Object.assign({}, vcfg, { bitrate: enc.bitrate });
      corrected = true;
      const r = await attempt();
      if(r.segs) blob = SonificationEngine.muxParallel(dims, FPS, audio.track, r.segs);
    }
    dset('size', (blob.size/1e6).toFixed(2) + ' MB');
    dset('t video', ((T()-t)/1000).toFixed(1) + ' s');
    return { style:prep.style, id:prep.id, duration:prep.duration, exact:prep.exact, mp3:audio.mp3, mp3Encoder:audio.mp3Encoder,
             video:{ blob, ext:'mp4', w:dims.VW, h:dims.VH, codec:vcfg.codec, audioCodec:audio.track.codec } };
  }

  // fastest route first; on any problem, the previous single-worker route
  async function runBest(file){
    const able = typeof Worker !== 'undefined' && typeof OffscreenCanvas !== 'undefined' &&
                 typeof VideoEncoder !== 'undefined' && typeof AudioEncoder !== 'undefined' && !window.__noParallel;
    if(able){
      try{ return await runParallel(file); }
      catch(e){
        stopAllJobs();
        if(e && e.infra === false && /decode|image|bitmap|source/i.test(String(e.err && e.err.message))) throw e.err;  // the image itself is bad
        derr('parallel route failed, using single worker: ' + String(e && (e.err && e.err.message || e.message) || e));
      }
    }
    return await runPipeline(file);
  }

  async function runPipeline(file){
    const bytes = new Uint8Array(await file.arrayBuffer());
    let out;
    dset('path', 'worker'); dset('file', (file.type || '?') + ' ' + (bytes.length/1048576).toFixed(1) + ' MB');
    try{ out = await runInWorker(bytes, file.type); }
    catch(e){
      if(e && e.infra === false) throw e.err;                       // bad/unsupported image: no retry
      dset('path', 'page (workers unavailable)');
      out = await SonificationEngine.run(bytes, file.type, onProgress, { maxVideoWidth:MAX_VIDEO_W }); // workers unavailable: run in the page
    }
    if(out.videoErr) derr('video: ' + out.videoErr);
    if(out.needsRealtime){                                           // no offline video encoder: record it live
      dset('video', 'live recording fallback');
      const pcm = { sampleRate:out.sampleRate, length:out.pcmL.length, duration:out.pcmL.length/out.sampleRate,
                    numberOfChannels:2, L:out.pcmL, R:out.pcmR, getChannelData(c){ return c ? this.R : this.L; } };
      let last = performance.now();
      const rec = SonificationEngine.renderVideoRealtime(pcm, { image:out.image }, out.events, out.track,
                    p=>{ last = performance.now(); onProgress(0.16 + 0.84*p); }, sharedAC, MAX_VIDEO_W);
      const stall = new Promise(res=>{ const t = setInterval(()=>{ if(performance.now()-last > 15000){ clearInterval(t); res(null); } }, 2000); rec.then(()=>clearInterval(t), ()=>clearInterval(t)); });
      try{ out.video = await Promise.race([rec, stall]); }
      catch(err){ out.video = null; }
    }
    return out;
  }

  async function startProcessing(file){
    releaseMedia();
    state = 'processing';
    DIAG.info = {}; DIAG.errors = []; DIAG.t0 = performance.now();
    resetDot.classList.remove('show');
    btnAudio.classList.remove('show');
    btnVideo.classList.remove('show');
    current = null;
    targetEnergy = 2.1;
    if(T>0) Tdir = -1;
    ring.classList.add('show');
    ringProgress.style.transition = 'none';
    shownP = 0; targetP = 0; realP = 0; allDone = false; stageEnd = MILESTONES[0];
    ringProgress.setAttribute('stroke-dashoffset', CIRC);
    cancelAnimationFrame(ringRaf); ringLoop();

    let out = null;
    try{ out = await runBest(file); }
    catch(err){ console.error(err); }

    if(out){ dset('result', 'style ' + out.style + ' | ' + (out.duration ? out.duration.toFixed(1) + ' s | ' : '') +
                 'mp3 ' + (out.mp3 ? (out.mp3.size/1048576).toFixed(1) + ' MB' : 'none') + ' | video ' +
                 (out.video ? out.video.ext + ' ' + (out.video.blob.size/1048576).toFixed(1) + ' MB' + (out.video.w ? ' ' + out.video.w + 'x' + out.video.h + ' ' + out.video.codec + '/' + out.video.audioCodec : '') : 'none')); }

  // without words: the sphere bursts and settles back, ready for another image
  function failProcessing(){

    setTimeout(()=>{ state = 'idle'; }, 1500);
  }

  function finishProcessing(){
    targetEnergy = 1;
    ring.classList.remove('show');
    Tdir = 1;
  }

  function onSplitDone(){
    state = 'done';
    layoutIcons();
    setTimeout(()=>{
      if(current && (current.mp3 || (PLAY_MODE && current.video))) btnAudio.classList.add('show');
      if(current && current.video) btnVideo.classList.add('show');

    }, 250);
  }

  function onMergeDone(){
    state = 'idle';
  }

  function doReset(){
    if(state!=='done') return;
    releaseMedia();
    state = 'reversing';
    resetDot.classList.remove('show');
    btnAudio.classList.remove('show');
    btnVideo.classList.remove('show');

    Tdir = -1;

  resetDot.addEventListener('click', (e)=>{ e.stopPropagation(); doReset(); });

  function pulse(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }

  function linkDownload(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
  }
  async function offer(blob, filename){
    const dl = await downloadsP;
    if(dl){
      try{ await dl.save({ filename, data: blob }); return; }
      catch(err){ if(err && (err.code==='declined' || err.code==='rate_limited')) return; }
    }
    linkDownload(blob, filename);
  }

  // Clicking only saves the file - nothing is ever played. The short id in
  // the name comes from the image itself, so each image's files are unique
  // and the same image always gets the same name.
  // ---------- play edition: the sound plays and its sphere moves ----------
  let audioEl = null, audioUrl = null;
  function stopAudio(){ if(audioEl) audioEl.pause(); audioOn = false; btnAudio.classList.remove('playing'); }
  function releaseMedia(){
    stopAudio(); closeVideo(true);
    if(audioEl){ audioEl.removeAttribute('src'); audioEl.load(); }
    if(audioUrl) URL.revokeObjectURL(audioUrl);
    audioEl = null; audioUrl = null; analyser = null;
  }
  function playAudio(){
    pulse(btnAudio);
    if(!current) return;
    if(audioOn){ stopAudio(); return; }
    unlockAudio();
    if(!audioEl){
      const blob = current.video ? current.video.blob : current.mp3;     // the film carries the same sound
      if(!blob) return;
      audioUrl = URL.createObjectURL(blob);
      audioEl = new Audio(); audioEl.src = audioUrl; audioEl.preload = 'auto';
      audioEl.setAttribute('playsinline', ''); audioEl.playsInline = true;
      audioEl.addEventListener('ended', stopAudio);

          srcNode.connect(analyser); analyser.connect(sharedAC.destination);
          freqBuf = new Uint8Array(analyser.frequencyBinCount);

          for(let k=0;k<=NB;k++) bandBins.push(Math.max(1, Math.min(freqBuf.length-1, Math.round(60*Math.pow(8000/60, k/NB)/hz))));
          for(let k=1;k<=NB;k++) if(bandBins[k] <= bandBins[k-1]) bandBins[k] = bandBins[k-1] + 1;
        }catch(e){ analyser = null; derr('analyser: ' + e.message); }
      }
    }
    if(sharedAC && sharedAC.state !== 'running') sharedAC.resume();
    audioEl.play().then(()=>{ audioOn = true; btnAudio.classList.add('playing'); }).catch(e=>derr('audio: ' + e.message));
  }

  // ---------- play edition: the film in a quiet window ----------
  let modal = null, videoUrl = null;
  function buildModal(){
    const root = document.createElement('div'); root.className = 'vmodal';
    root.innerHTML = '<div class="vframe"><video playsinline preload="auto"></video><div class="vplay"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></div><div class="vbar"><i></i></div></div>' +
                     '<div class="vclose" role="button" tabindex="0" aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>';
    document.body.appendChild(root);
    const frame = root.querySelector('.vframe'), video = root.querySelector('video'), bar = root.querySelector('.vbar'), fill = bar.querySelector('i');
    const sync = ()=>{ fill.style.width = (video.duration ? 100*video.currentTime/video.duration : 0) + '%';
                       frame.classList.toggle('paused', video.paused); if(root.classList.contains('open')) requestAnimationFrame(sync); };
    root.addEventListener('click', e => { if(e.target === root) closeVideo(); });
    root.querySelector('.vclose').addEventListener('click', ()=>closeVideo());
    onKey(root.querySelector('.vclose'), ()=>closeVideo());
    video.addEventListener('click', ()=>{ video.paused ? video.play() : video.pause(); });
    video.addEventListener('ended', ()=>frame.classList.add('paused'));
    bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); if(video.duration) video.currentTime = video.duration*Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)); });
    modal = { root, frame, video, sync };
  }
  function openVideo(){
    pulse(btnVideo);
    if(!current || !current.video) return;
    stopAudio();
    if(!modal) buildModal();
    if(!videoUrl){ videoUrl = URL.createObjectURL(current.video.blob); modal.video.src = videoUrl; }
    modal.root.classList.add('open');
    modal.video.currentTime = 0;
    modal.video.play().catch(()=>{});
    requestAnimationFrame(modal.sync);
  }
  function closeVideo(release){
    if(!modal) return;
    modal.video.pause();
    modal.root.classList.remove('open');
    if(release && videoUrl){ modal.video.removeAttribute('src'); modal.video.load(); URL.revokeObjectURL(videoUrl); videoUrl = null; }
  }
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && modal && modal.root.classList.contains('open')) closeVideo(); });

  function saveAudio(){ if(PLAY_MODE) return playAudio(); pulse(btnAudio); if(current && current.mp3) offer(current.mp3, `sonification-${current.style}-${current.id}.mp3`); }
  function saveVideo(){ if(PLAY_MODE) return openVideo(); pulse(btnVideo); if(current && current.video) offer(current.video.blob, `sonification-${current.style}-${current.id}.${current.video.ext}`); }
  btnAudio.addEventListener('click', (e)=>{ e.stopPropagation(); saveAudio(); });
  btnVideo.addEventListener('click', (e)=>{ e.stopPropagation(); saveVideo(); });

  // top-centre dot: invert the whole palette (particle colour included)
  let inverted = false, colorRaf = 0;
  function toggleTheme(){
    inverted = !inverted;
    document.documentElement.classList.toggle('inverted', inverted);
    // particles fade in step with the page background (same 0.5s ease)
    const from = dotRGB.slice(), to = inverted ? [255,255,255] : [10,10,10], t0 = performance.now();
    cancelAnimationFrame(colorRaf);
    const step = ()=>{
      const k = Math.min(1, (performance.now()-t0)/500), e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      dotRGB = from.map((v,i)=>Math.round(v + (to[i]-v)*e));
      if(k<1) colorRaf = requestAnimationFrame(step);
    };
    colorRaf = requestAnimationFrame(step);
  }
  let pressT = 0, longPressed = false;
  themeDot.addEventListener('pointerdown', ()=>{ longPressed = false; clearTimeout(pressT);
    pressT = setTimeout(()=>{ longPressed = true; DIAG.on = !DIAG.on; if(DIAG.on) drender(); else if(DIAG.el){ DIAG.el.remove(); DIAG.el = null; } }, 1000); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => themeDot.addEventListener(ev, ()=>clearTimeout(pressT)));
  themeDot.addEventListener('contextmenu', e => e.preventDefault());
  themeDot.addEventListener('click', ()=>{ if(longPressed){ longPressed = false; return; } toggleTheme(); });

  // ---------- keyboard: everything works without a mouse, nothing visible changes ----------
  function onKey(el, fn){
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); fn(); }
    });
  }
  onKey(field, ()=>{ if(uploadable()) openPicker(); });
  onKey(resetDot, doReset);
  onKey(btnAudio, saveAudio);
  onKey(btnVideo, saveVideo);
  onKey(themeDot, toggleTheme);
})();
</script>
</body>
</html>
