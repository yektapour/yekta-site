<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonification</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#ffffff;
    --dot:#0a0a0a;
    --track:rgba(10,10,10,.16);
    --hoverbg:rgba(10,10,10,.07);
    --halo:rgba(10,10,10,.09);
  }
  html.inverted{
    --bg:#0a0a0a;
    --dot:#ffffff;
    --track:rgba(255,255,255,.22);
    --hoverbg:rgba(255,255,255,.12);
    --halo:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0; background:var(--bg); overflow:hidden;
    transition:background .5s ease;
  }
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

  .stage{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .field{ position:relative; width:min(72vmin, 520px); height:min(72vmin, 520px); }

  /* canvas is intentionally much larger than the field so the two side
     spheres and the flowing particles never get clipped at its edges */
  canvas.gl{ position:absolute; display:block; pointer-events:none; }

  svg.ringsvg{
    position:absolute; inset:0; width:100%; height:100%; overflow:visible;
    transform:rotate(-90deg); transition:opacity .5s ease; opacity:0; pointer-events:none;
  }
  svg.ringsvg.show{ opacity:1; }

  .side-icon{
    position:absolute; left:0; top:0; width:52px; height:52px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    cursor:pointer; opacity:0; pointer-events:none;
    transform:translate(-50%,-50%) scale(.7);
    transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1), background .25s ease;
  }
  .side-icon.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .side-icon:hover{ background:var(--hoverbg); }
  .side-icon svg{ width:26px; height:26px; stroke:var(--dot); }
  .side-icon.pulse{ animation:pulseIcon .45s ease; }
  @keyframes pulseIcon{
    0%{ transform:translate(-50%,-50%) scale(1); }
    45%{ transform:translate(-50%,-50%) scale(1.28); }
    100%{ transform:translate(-50%,-50%) scale(1); }
  }

  /* small dot exactly between the two spheres: tap = play everything in reverse */
  .reset-dot{
    position:absolute; left:50%; top:50%;
    width:10px; height:10px; border-radius:50%;
    background:var(--dot);
    transform:translate(-50%,-50%) scale(0);
    opacity:0; pointer-events:none; cursor:pointer;
    transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
  }
  .reset-dot::before{ content:""; position:absolute; inset:-17px; border-radius:50%; } /* comfortable touch target */
  .reset-dot.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  .reset-dot.show:hover{ box-shadow:0 0 0 7px var(--halo); transform:translate(-50%,-50%) scale(1.15); }

  /* dot fixed at the very top-centre of the page: tap = invert the palette */
  .theme-dot{
    position:fixed; left:50%; top:max(20px, calc(env(safe-area-inset-top,0px) + 16px));
    width:9px; height:9px; border-radius:50%;
    background:var(--dot);
    transform:translate(-50%,-50%);
    cursor:pointer; z-index:5;
    transition:box-shadow .3s ease;
  }
  .theme-dot::before{ content:""; position:absolute; inset:-16px; border-radius:50%; }
  .theme-dot:hover{ box-shadow:0 0 0 7px var(--halo); }

  .reset-dot{ transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, background .5s ease; }
  .theme-dot{ transition:box-shadow .3s ease, background .5s ease; }
  .side-icon svg, #ring circle{ transition:stroke .5s ease; }
  .field, .side-icon, .reset-dot, .theme-dot{ outline:none; }
  .field:focus-visible{ border-radius:50%; box-shadow:0 0 0 1px var(--track); }
  .side-icon:focus-visible, .reset-dot:focus-visible, .theme-dot:focus-visible{ box-shadow:0 0 0 7px var(--halo); }
  /* play edition: the sound icon breathes while playing; the film opens in a quiet window */
  .side-icon.playing svg{ animation:breathe 1.8s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.14); opacity:.7; } }
  .vmodal{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
           opacity:0; pointer-events:none; transition:opacity .45s ease; }
  .vmodal::before{ content:""; position:absolute; inset:0; background:var(--bg); opacity:.9;
                   -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  .vmodal.open{ opacity:1; pointer-events:auto; }
  .vframe{ position:relative; transform:translateY(10px) scale(.97); transition:transform .55s cubic-bezier(.2,.8,.2,1); }
  .vmodal.open .vframe{ transform:none; }
  .vframe video{ display:block; max-width:min(88vw, 640px); max-height:calc(86vh - 40px); border-radius:14px; background:#000; cursor:pointer;
                 box-shadow:0 24px 70px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.06); }
  .vbar{ position:relative; height:2px; margin:16px auto 0; width:100%; background:var(--track); border-radius:2px; cursor:pointer; }
  .vbar::before{ content:""; position:absolute; left:0; right:0; top:-12px; bottom:-12px; }
  .vbar i{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--dot); border-radius:2px; }
  .vplay{ position:absolute; left:50%; top:calc(50% - 9px); width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%;
          display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.16);
          -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); opacity:0; transition:opacity .3s ease; pointer-events:none; }
  .vplay svg{ width:24px; height:24px; fill:#fff; margin-left:3px; }
  .vframe.paused .vplay{ opacity:1; }
  .vclose{ position:absolute; top:max(16px, calc(env(safe-area-inset-top,0px) + 10px)); right:16px; width:42px; height:42px; border-radius:50%;
           display:flex; align-items:center; justify-content:center; cursor:pointer; outline:none; transition:background .25s ease; }
  .vclose svg{ width:18px; height:18px; stroke:var(--dot); }
  .vclose:hover, .vclose:focus-visible{ background:var(--hoverbg); }
  input[type=file]{ display:none; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.2s !important; } }
</style>

  // grey pixels stay pure sine
  function toneAt(info, idx){
    const s = info.sat[idx], warm = 0.5 + 0.5*DM.cos(6.283185307179586*(info.hue[idx] - 0.05));
    return [0.45*s*warm, 0.25*s*warm, 0.3*s*(1-warm)];
  }

  // ================= deterministic sample renderer =================
  // All synthesis is rendered here, sample by sample, in plain JavaScript -
  // not through the browser's audio graph, whose internal mixing order is
  // not fixed. Only +,-,*,/ touch the samples, and the sine table is built
  // from two hard-coded constants by an exact arithmetic recurrence, so
  // the same image always renders the exact same bytes.
  const SIN_N = 8192;
  const SIN = (function(){
    const t = new Float64Array(SIN_N+2);
    const c = 0.9999997058628822, s1 = 0.0007669903187427045;   // cos/sin(2*pi/8192)
    t[0] = 0; t[1] = s1;
    for(let k=1;k<=SIN_N;k++) t[k+1] = 2*c*t[k] - t[k-1];
    return t;
  })();
  function sinCycle(ph){            // ph in cycles, >= 0
    const x = (ph - Math.floor(ph))*SIN_N, i = x|0, fr = x - i;
    return SIN[i] + (SIN[i+1]-SIN[i])*fr;
  }
  const HALF_PI_CYC = 0.25;         // quarter cycle
  function panGains(pan){           // equal-power, as the standard stereo panner
    const x = (Math.max(-1,Math.min(1,pan))+1)/2;
    return [ sinCycle(x*HALF_PI_CYC + 0.25), sinCycle(x*HALF_PI_CYC) ];   // [cos, sin] of x*pi/2
  }

  function makeMix(seconds){
    const n = Math.ceil(SR*seconds);
    return { n, L:new Float32Array(n), R:new Float32Array(n), jobs:[] };
  }

  // piecewise-linear breakpoints [[t,v],...]; equal times give a step
  function curve(pts){
    let k = 0;
    return t => {
      if(t <= pts[0][0]) return pts[0][1];
      while(k < pts.length-2 && t >= pts[k+1][0]) k++;
      const a = pts[k], b = pts[k+1];
      if(!b || t >= b[0]) return (b||a)[1];
      const d = b[0]-a[0];
      return d > 0 ? a[1] + (b[1]-a[1])*(t-a[0])/d : b[1];
    };
  }

  function renderVoice(mix, j){
    const i0 = Math.max(0, Math.round(j.t0*SR)), i1 = Math.min(mix.n, Math.round(j.t1*SR));
    if(i1 <= i0) return;
    const fq = curve(j.freqPts), gn = curve(j.gainPts);
    const [gL, gR] = panGains(j.pan);
    let ph = 0, rph = 0;
    const rInc = j.ring ? j.ring/SR : 0;
    const tn = j.tone || [0,0,0], h2 = tn[0], h3 = tn[1], hb = tn[2];
    const norm = 1/(1 + 0.5*(h2+h3+hb));
    const rich = (h2+h3+hb) > 1e-4;
    for(let i=i0;i<i1;i++){
      const t = i/SR;
      let s = sinCycle(ph);
      if(rich) s = (s + h2*sinCycle(ph*2) + h3*sinCycle(ph*3) + hb*sinCycle(ph*2.756))*norm;
      if(rInc){ s *= sinCycle(rph); rph += rInc; }
      s *= gn(t);
      mix.L[i] += s*gL; mix.R[i] += s*gR;
      ph += fq(t)/SR;
    }
  }

  function renderNoise(mix, j){
    const i0 = Math.max(0, Math.round(j.t0*SR)), i1 = Math.min(mix.n, Math.round((j.t0+j.dur)*SR));
    if(i1 <= i0) return;
    const nr = mulberry32(j.seed);
    const w0 = j.filterHz/SR;                           // cycles/sample
    const cw = sinCycle(w0 + 0.25), sw = sinCycle(w0);
    let b0, b1, b2, a1, a2;
    if(j.type === 'lowpass'){
      const Q = DM.pow(10, (j.filterQ||0.5)/20), al = sw/(2*Q), a0 = 1+al;
      b0 = (1-cw)/2/a0; b1 = (1-cw)/a0; b2 = b0; a1 = -2*cw/a0; a2 = (1-al)/a0;
    } else {
      const Q = j.filterQ||1, al = sw/(2*Q), a0 = 1+al;
      b0 = al/a0; b1 = 0; b2 = -al/a0; a1 = -2*cw/a0; a2 = (1-al)/a0;
    }
    const gn = curve(j.gainPts);
    const [gL, gR] = panGains(j.pan);
    let x1=0, x2=0, y1=0, y2=0;
    for(let i=i0;i<i1;i++){
      const x = nr()*2-1;
      const y = b0*x + b1*x1 + b2*x2 - a1*y1 - a2*y2;
      x2=x1; x1=x; y2=y1; y1=y;
      const s = y*gn(i/SR);
      mix.L[i] += s*gL; mix.R[i] += s*gR;
    }
  }

  // ---- movement textures (gaze travelling between fixations) ----
  // AIR: one continuous noise stream through a band-pass filter whose centre,
  // loudness and position follow the path (coefficients updated every 32 samples)
  function renderAir(mix, j){
    const i0 = Math.max(0, Math.round(j.t0*SR)), i1 = Math.min(mix.n, Math.round(j.t1*SR));
    if(i1 <= i0) return;
    const nr = mulberry32(j.seed), fq = curve(j.freqPts), gn = curve(j.gainPts), pn = curve(j.panPts);
    let x1=0, x2=0, y1=0, y2=0, b0=0, b2=0, a1=0, a2=0, gL=0, gR=0, g=0;
    for(let i=i0;i<i1;i++){
      if(((i - i0) & 31) === 0){
        const t = i/SR, fc = fq(t), w0 = fc/SR, cw = sinCycle(w0 + 0.25), sw = sinCycle(w0), al = sw/(2*j.q), a0 = 1+al;
        b0 = al/a0; b2 = -al/a0; a1 = -2*cw/a0; a2 = (1-al)/a0;
        const pg = panGains(pn(t)); gL = pg[0]; gR = pg[1];
        g = gn(t) / (0.577*Math.sqrt((fc/j.q)/(SR/2)));           // narrow-band noise -> same loudness as its gain
      }
      const x = nr()*2-1, y = b0*x + b2*x2 - a1*y1 - a2*y2;
      x2=x1; x1=x; y2=y1; y1=y;
      const s = y*g; mix.L[i] += s*gL; mix.R[i] += s*gR;
    }
  }
  // CLICK: a 1.5-4 ms burst, a decaying ring at a pitch taken from the pixel
  function renderClick(mix, j){
    const i0 = Math.max(0, Math.round(j.t*SR)), n = Math.round(j.len*SR), i1 = Math.min(mix.n, i0+n);
    const d = DM.exp(-1/(j.tau*SR)), inc = j.f/SR, [gL, gR] = panGains(j.pan);
    let env = j.amp, ph = 0;
    for(let i=i0;i<i1;i++){ const s = env*sinCycle(ph); mix.L[i] += s*gL; mix.R[i] += s*gR; env *= d; ph += inc; }
  }
  // GLITCH: noise held for `hold` samples and quantised to few levels (digital grit)
  function renderCrush(mix, j){
    const i0 = Math.max(0, Math.round(j.t0*SR)), i1 = Math.min(mix.n, Math.round((j.t0+j.dur)*SR));
    if(i1 <= i0) return;
    const nr = mulberry32(j.seed), gn = curve(j.gainPts), [gL, gR] = panGains(j.pan);
    let v = 0;
    for(let i=i0;i<i1;i++){
      if((i - i0) % j.hold === 0) v = Math.round((nr()*2-1)*j.levels)/j.levels;
      const s = v*gn(i/SR); mix.L[i] += s*gL; mix.R[i] += s*gR;
    }
  }

  // same call shapes the techniques already use; they now queue jobs
  function grain(mix, _bus, {time, freq, amp, pan, dur, ring, freqEnd, tone}){
    if(time<0 || amp<=0.0008 || dur<=0.002) return;
    const atk = Math.min(0.012, dur*0.3), rel = Math.max(dur*0.35, 0.01);
    mix.jobs.push({ kind:'voice', t0:time, t1:time+dur, pan, ring: ring||0, tone: tone||null,
      freqPts: freqEnd ? [[time,freq],[time+dur,freqEnd]] : [[time,freq]],
      gainPts: [[time,0],[time+atk,amp],[Math.max(time+atk, time+dur-rel),amp],[time+dur,0]] });
  }
  function noiseGrain(mix, _bus, rand, {time, dur, amp, pan, filterHz, filterQ, type}){
    if(time<0 || dur<=0.005) return;
    const atk = Math.min(0.03, dur*0.3), rel = Math.max(dur*0.4, 0.02);
    mix.jobs.push({ kind:'noise', t0:time, dur, pan, filterHz, filterQ, type:type||'bandpass',
      seed: Math.floor(rand()*4294967296),
      gainPts: [[time,0],[time+atk,amp],[Math.max(time+atk, time+dur-rel),amp],[time+dur,0]] });
  }
  function sustainedVoice(mix, j){ mix.jobs.push(Object.assign({kind:'voice', ring:0}, j)); }

  async function renderJobs(mix, onProgress){
    let last = performance.now();
    for(let k=0;k<mix.jobs.length;k++){
      const j = mix.jobs[k];
      if(j.kind==='voice') renderVoice(mix, j);
      else if(j.kind==='noise') renderNoise(mix, j);
      else if(j.kind==='air') renderAir(mix, j);
      else if(j.kind==='click') renderClick(mix, j);
      else if(j.kind==='crush') renderCrush(mix, j);
      if(performance.now()-last > 30){
        if(onProgress) onProgress(k/mix.jobs.length);
        await new Promise(r=>{ const ch=new MessageChannel(); ch.port1.onmessage=()=>r(); ch.port2.postMessage(0); });
        last = performance.now();
      }
    }
  }

  // Every style also logs WHERE in the image (fractional x,y - image
  // coordinates, not audio pan) each sound event came from, and WHEN.
  // This is the only source the video's red gaze-halo reads from later -
  // it is not a separate guess, it is literally the position each sound
  // was generated at.

  // ---------------- tiny power-of-2 FFT (for saliency only) ----------------
  function fft1d(re, im, invert){
    const n = re.length;
    for(let i=1,j=0;i<n;i++){
      let bit=n>>1;
      for(;j&bit;bit>>=1) j^=bit;
      j^=bit;
      if(i<j){ [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]]; }
    }
    for(let len=2; len<=n; len<<=1){
      const ang = (invert?1:-1)*2*Math.PI/len;
      const wr=DM.cos(ang), wi=DM.sin(ang);
      for(let i=0;i<n;i+=len){
        let cwr=1, cwi=0;
        for(let k=0;k<len/2;k++){
          const ur=re[i+k], ui=im[i+k];
          const vr=re[i+k+len/2]*cwr - im[i+k+len/2]*cwi;
          const vi=re[i+k+len/2]*cwi + im[i+k+len/2]*cwr;
          re[i+k]=ur+vr; im[i+k]=ui+vi;
          re[i+k+len/2]=ur-vr; im[i+k+len/2]=ui-vi;
          const nwr=cwr*wr-cwi*wi, nwi=cwr*wi+cwi*wr; cwr=nwr; cwi=nwi;
        }
      }
    }
    if(invert) for(let i=0;i<n;i++){ re[i]/=n; im[i]/=n; }
  }
  function fft2d(re, im, N, invert){
    const row = new Float64Array(N), rowI = new Float64Array(N);
    for(let y=0;y<N;y++){
      for(let x=0;x<N;x++){ row[x]=re[y*N+x]; rowI[x]=im[y*N+x]; }
      fft1d(row, rowI, invert);
      for(let x=0;x<N;x++){ re[y*N+x]=row[x]; im[y*N+x]=rowI[x]; }
    }
    const col = new Float64Array(N), colI = new Float64Array(N);
    for(let x=0;x<N;x++){
      for(let y=0;y<N;y++){ col[y]=re[y*N+x]; colI[y]=im[y*N+x]; }
      fft1d(col, colI, invert);
      for(let y=0;y<N;y++){ re[y*N+x]=col[y]; im[y*N+x]=colI[y]; }
    }
  }
  function boxBlur3(a, N){
    const out = new Float64Array(N*N);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      let s=0,c=0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const yy=y+dy, xx=x+dx;
        if(yy>=0&&yy<N&&xx>=0&&xx<N){ s+=a[yy*N+xx]; c++; }
      }
      out[y*N+x]=s/c;
    }
    return out;
  }
  function gaussianBlur(a, N, sigma){
    const r = Math.ceil(sigma*3);
    const k = new Float64Array(2*r+1);
    let ks=0; for(let i=-r;i<=r;i++){ k[i+r]=DM.exp(-(i*i)/(2*sigma*sigma)); ks+=k[i+r]; }
    for(let i=0;i<k.length;i++) k[i]/=ks;
    const tmp = new Float64Array(N*N), out = new Float64Array(N*N);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      let s=0; for(let i=-r;i<=r;i++){ const xx=Math.min(N-1,Math.max(0,x+i)); s+=a[y*N+xx]*k[i+r]; }
      tmp[y*N+x]=s;
    }
    for(let x=0;x<N;x++) for(let y=0;y<N;y++){
      let s=0; for(let i=-r;i<=r;i++){ const yy=Math.min(N-1,Math.max(0,y+i)); s+=tmp[yy*N+x]*k[i+r]; }
      out[y*N+x]=s;
    }
    return out;
  }

  // Spectral-residual visual saliency (Hou & Zhang, 2007) + a mild
  // central fixation bias, matched to the free-viewing eye-tracking
  // literature (Tatler, 2007) - the same bottom-up attention model used
  // in the offline reference version documented alongside this project.
  function saliencyMap(lum, W, H){
    const N = 128;
    const g = new Float64Array(N*N);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const sx = Math.min(W-1, Math.floor(x*W/N)), sy = Math.min(H-1, Math.floor(y*H/N));
      g[y*N+x] = lum[sy*W+sx];
    }
    const win = new Float64Array(N);
    for(let i=0;i<N;i++) win[i] = 0.5-0.5*DM.cos(2*Math.PI*i/(N-1));
    let gmean=0; for(const v of g) gmean+=v; gmean/=g.length;
    const re = new Float64Array(N*N), im = new Float64Array(N*N);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const wgt = win[x]*win[y];
      re[y*N+x] = g[y*N+x]*wgt + gmean*(1-wgt);
    }
    fft2d(re, im, N, false);
    const logAmp = new Float64Array(N*N), phase = new Float64Array(N*N);
    for(let i=0;i<N*N;i++){ logAmp[i]=DM.log(DM.hypot(re[i],im[i])+1e-8); phase[i]=DM.atan2(im[i],re[i]); }
    const avg = boxBlur3(logAmp, N);
    const resid = new Float64Array(N*N);
    for(let i=0;i<N*N;i++) resid[i]=logAmp[i]-avg[i];
    const re2=new Float64Array(N*N), im2=new Float64Array(N*N);
    for(let i=0;i<N*N;i++){ const e=DM.exp(resid[i]); re2[i]=e*DM.cos(phase[i]); im2[i]=e*DM.sin(phase[i]); }
    fft2d(re2, im2, N, true);
    let sal = new Float64Array(N*N);
    for(let i=0;i<N*N;i++) sal[i]=re2[i]*re2[i]+im2[i]*im2[i];
    sal = gaussianBlur(sal, N, 3);
    const m=4;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(x<m||x>=N-m||y<m||y>=N-m) sal[y*N+x]=0;
    let mn=Infinity,mx=-Infinity; for(const v of sal){ if(v<mn)mn=v; if(v>mx)mx=v; }
    for(let i=0;i<N*N;i++) sal[i]=(sal[i]-mn)/((mx-mn)||1);
    const cx=N/2, cy=N/2;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const bias = DM.exp(-((x-cx)*(x-cx)/(2*(N*0.4)*(N*0.4)) + (y-cy)*(y-cy)/(2*(N*0.4)*(N*0.4))));
      sal[y*N+x] *= (0.7+0.3*bias);
    }
    mx=-Infinity; for(const v of sal) if(v>mx) mx=v;
    for(let i=0;i<N*N;i++) sal[i]/=(mx||1);
    return {sal, N};
  }

  // Winner-take-all + inhibition-of-return fixation sequence.
  function extractFixations(sal, N, nFix){
    const s = sal.slice();
    const fixations = [];
    const inhibR = 0.11*N;
    for(let f=0; f<nFix; f++){
      let best=-1, bx=0, by=0;
      for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const v=s[y*N+x]; if(v>best){ best=v; bx=x; by=y; } }
      fixations.push({x:bx/N, y:by/N, sal:best});
      for(let y=0;y<N;y++) for(let x=0;x<N;x++){
        const d2=(x-bx)*(x-bx)+(y-by)*(y-by);
        s[y*N+x] *= (1-0.92*DM.exp(-d2/(2*inhibR*inhibR)));
      }
    }
    return fixations;
  }

  // ---------------- the shared gaze plan ----------------
  // The time structure of EVERY technique comes from the same simulated
  // viewing of the image (as documented): a spectral-residual saliency map,
  // 16 fixations chosen by winner-take-all with inhibition of return, dwell
  // times proportional to saliency, and saccades between them. Techniques
  // differ only in how a fixation and a saccade sound - never in where or
  // when the eye looks - and every sound is taken from pixels inside the
  // region being looked at.
  function buildGazePlan(info){
    const {W,H,lum,edge,duration} = info;
    const {sal, N} = saliencyMap(lum, W, H);
    const fx = extractFixations(sal, N, 16);
    const baseRadius = 0.1;
    const fixations = fx.map(f=>{
      const r = baseRadius*(1.3-0.5*f.sal)*Math.min(W,H);
      const cx = f.x*W, cy = f.y*H, pix = [];
      let es = 0;
      for(let y=Math.max(0,Math.floor(cy-r)); y<Math.min(H,Math.ceil(cy+r)); y++){
        for(let x=Math.max(0,Math.floor(cx-r)); x<Math.min(W,Math.ceil(cx+r)); x++){
          if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r){ const i=y*W+x; pix.push(i); es += edge[i]; }
        }
      }
      if(!pix.length) pix.push(Math.min(H-1,Math.floor(cy))*W + Math.min(W-1,Math.floor(cx)));
      pix.sort((a,b)=>lum[b]-lum[a]);
      return { x:f.x, y:f.y, sal:f.sal, pix, ed: es/pix.length };
    });
    const edMn = Math.min(...fixations.map(f=>f.ed)), edMx = Math.max(...fixations.map(f=>f.ed));
    fixations.forEach(f=>{ f.edNorm = (f.ed-edMn)/((edMx-edMn)||1); });

    const dwellW = fixations.map(f=>0.18+Math.sqrt(f.sal));
    const saccW = [];
    for(let i=0;i<fixations.length-1;i++){
      saccW.push(0.22 + DM.hypot(fixations[i+1].x-fixations[i].x, fixations[i+1].y-fixations[i].y)*0.55);
    }
    const scale = duration/(dwellW.reduce((a,b)=>a+b,0) + saccW.reduce((a,b)=>a+b,0));
    const saccades = [], track = [];
    let t = 0;
    fixations.forEach((f,i)=>{
      f.t0 = t; f.t1 = t + dwellW[i]*scale; t = f.t1;
      track.push({type:'dwell', t0:f.t0, t1:f.t1, x:f.x, y:f.y, sal:f.sal});
      if(i<fixations.length-1){
        const n = fixations[i+1];
        const s = {t0:t, t1:t+saccW[i]*scale, x0:f.x, y0:f.y, x1:n.x, y1:n.y, from:i};
        saccades.push(s);
        track.push({type:'saccade', t0:s.t0, t1:s.t1, x0:s.x0, y0:s.y0, x1:s.x1, y1:s.y1});
        t = s.t1;
      }
    });
    return { fixations, saccades, track };
  }

  // points along a saccade, eased exactly like the halo that shows it
  function pathSamples(info, s, stepSec){
    const {W,H} = info, dur = s.t1-s.t0;
    const steps = Math.max(2, Math.round(dur/stepSec)), out = [];
    for(let k=0;k<steps;k++){
      const fr = k/(steps-1), e = fr*fr*(3-2*fr);
      const xf = s.x0+(s.x1-s.x0)*e, yf = s.y0+(s.y1-s.y0)*e;
      const col = Math.max(0,Math.min(W-1,Math.floor(xf*W))), row = Math.max(0,Math.min(H-1,Math.floor(yf*H)));
      out.push({ t:s.t0+fr*dur, xf, yf, col, row, idx:row*W+col, step:dur/steps });
    }
    return out;
  }
  const clampPan = v => Math.max(-1, Math.min(1, v));

  // Sound of the gaze travelling between two fixations. No pitched glides:
  // three textures, mixed point by point by what the eye is crossing -
  //   smooth areas  -> AIR   (filtered noise; the pixel's row sets the filter centre)
  //   edges / lines -> CLICK (density and sharpness from the edge strength)
  //   abrupt light changes along the path -> GLITCH (coarseness from the image)
  // brightness sets loudness, horizontal position (and colour) set left/right.
  function movementTexture(mix0, info, s, rng, events, level){
    const {W, H, lum, hue, sat, edge} = info;
    const mix = { jobs: [] };                                 // collected per movement, placed later
    const pts = pathSamples(info, s, 0.05);
    const ss = x => x <= 0 ? 0 : x >= 1 ? 1 : x*x*(3-2*x);
    const freqPts = [], gainPts = [], panPts = [];
    let prevL = lum[pts[0].idx];
    for(const q of pts){
      const L = lum[q.idx], e = edge[q.idx], sa = sat[q.idx];
      const jump = Math.min(1, Math.abs(L - prevL)*5); prevL = L;
      const wC = ss((e - 0.15)/0.45);                        // edges -> clicks
      const wG = ss((jump - 0.15)/0.5);                      // abrupt light changes -> glitch
      const wN = Math.max(0, 1 - wC - 0.7*wG);               // the rest -> air
      const base = DM.pow(L, 1.3)*level;
      const pan = clampPan(0.75*(q.xf*2-1) + 0.25*(hue[q.idx]*2-1)*sa);
      freqPts.push([q.t, Math.max(150, Math.min(7000, freqAt(q.row, H)*2.2))]);
      gainPts.push([q.t, base*wN*0.55]);
      panPts.push([q.t, pan]);
      const rate = (6 + 70*e)*wC;                            // clicks per second
      let tc = q.t + rng()*q.step*0.3;
      while(rate > 0 && tc < q.t + q.step){
        const amp = base*wC*(0.6 + 0.4*rng())*1.6, tau = 0.0015 + 0.0025*(1-e);
        mix.jobs.push({ kind:'click', t:tc, len:tau*5, tau, amp, f:Math.min(9000, freqAt(q.row, H)*3), pan });
        tc += -DM.log(1 - rng())/rate;
      }
      if(wG > 0.08){
        mix.jobs.push({ kind:'crush', t0:q.t, dur:q.step*1.5, pan, seed:Math.floor(rng()*4294967296),
                        hold: 4 + Math.round(36*q.row/(H-1)), levels: 2 + Math.round(5*(1-sa)),
                        gainPts:[[q.t,0],[q.t+q.step*0.3, base*wG*0.35],[q.t+q.step*1.5,0]] });
      }
      events.push({ t:q.t, dur:q.step*1.6, x:q.col/W, y:q.row/H, amp:base });
    }
    mix.jobs.push({ kind:'air', t0:s.t0, t1:s.t1, q:1.4, seed:Math.floor(rng()*4294967296),
                    freqPts, gainPts:[[s.t0,0]].concat(gainPts, [[s.t1,0]]), panPts });
    (mix0.moveGroups = mix0.moveGroups || []).push({ t0:s.t0, t1:s.t1 + 0.3, jobs:mix.jobs });
  }

  // Movement textures are placed relative to the same piece's fixations:
  // each movement is rendered once to measure it, then mixed so that its
  // loudness sits 9 dB below the fixations - and its peaks never exceed 80%
  // of the fixations' peak, so they can never push the rest down.
  const MOVE_DB = -9;
  function shiftJob(j, dt){
    const sh = pts => pts.map(([t,v]) => [t-dt, v]);
    const o = Object.assign({}, j);
    if('t0' in j) o.t0 = j.t0 - dt;
    if('t1' in j) o.t1 = j.t1 - dt;
    if('t'  in j) o.t  = j.t  - dt;
    for(const k of ['freqPts','gainPts','panPts']) if(j[k]) o[k] = sh(j[k]);
    return o;
  }
  function renderGroup(g){
    const tmp = { n: Math.ceil((g.t1 - g.t0)*SR) + 1 };
    tmp.L = new Float32Array(tmp.n); tmp.R = new Float32Array(tmp.n);
    for(const j of g.jobs){
      const k = shiftJob(j, g.t0);
      if(k.kind==='air') renderAir(tmp, k); else if(k.kind==='click') renderClick(tmp, k); else renderCrush(tmp, k);
    }
    return tmp;
  }
  async function placeMovement(mix, track){
    const groups = mix.moveGroups || [];
    if(!groups.length) return;
    let fe = 0, fn = 0, fpk = 0;
    for(const seg of track) if(seg.type === 'dwell'){
      const a = Math.round(seg.t0*SR), b = Math.min(mix.n, Math.round(seg.t1*SR));
      for(let i=a;i<b;i++){ const l = mix.L[i], r = mix.R[i]; fe += l*l + r*r; const m = Math.max(Math.abs(l), Math.abs(r)); if(m > fpk) fpk = m; }
      fn += 2*(b-a);
    }
    let me = 0, mn = 0, mpk = 0;
    for(const g of groups){
      const t = renderGroup(g);
      for(let i=0;i<t.n;i++){ const l = t.L[i], r = t.R[i]; me += l*l + r*r; const m = Math.max(Math.abs(l), Math.abs(r)); if(m > mpk) mpk = m; }
      mn += 2*t.n;
      await yieldUI();
    }
    if(!(fe > 0 && me > 0)) return;
    const fixRms = Math.sqrt(fe/fn), moveRms = Math.sqrt(me/mn);
    let gain = fixRms*DM.pow(10, MOVE_DB/20)/moveRms;
    if(gain*mpk > 0.8*fpk) gain = 0.8*fpk/mpk;
    for(const g of groups){
      const t = renderGroup(g), off = Math.round(g.t0*SR);
      for(let i=0;i<t.n && off+i<mix.n;i++){ mix.L[off+i] += t.L[i]*gain; mix.R[off+i] += t.R[i]*gain; }
      await yieldUI();
    }
  }

  // ---------------- technique: pointillist ----------------
  // discrete sine points; sharp contours become short ring-modulated points
  function synthPointillist(ctx, bus, info, rand, events, plan){
    const {W,H,lum,hue,sat,edge} = info;
    for(const f of plan.fixations){
      const dwell = f.t1-f.t0;
      const K = Math.round(3+f.edNorm*11);
      const chosen = f.pix.slice(0, Math.min(K, f.pix.length));
      const ampBoost = 0.55+f.edNorm*0.9;
      chosen.forEach((idx,k)=>{
        const row = Math.floor(idx/W), col = idx%W, e = edge[idx];
        const amp = DM.pow(lum[idx],1.4)*ampBoost*0.32;
        if(amp<0.012) return;
        const pan = clampPan(0.65*(f.x*2-1) + 0.35*(hue[idx]*2-1)*(0.3+sat[idx]));
        let dur, ring;
        if(e>0.35){ dur = Math.min(dwell, 0.08+rand()*0.14); ring = 20+e*900; }
        else { dur = dwell*(0.5+rand()*0.45); ring = null; }
        const gt = f.t0 + (k/Math.max(chosen.length,1))*dwell*0.25;
        grain(ctx, bus, {time:gt, freq:freqAt(row,H), amp, pan, dur, ring, tone:toneAt(info, idx)});
        events.push({t:gt, dur, x:col/W, y:row/H, amp});
      });
    }
    for(const s of plan.saccades) movementTexture(ctx, info, s, rand, events, 0.30);
  }

  // ---------------- technique: stochastic clouds ----------------
  // each fixation becomes a dense cloud of gliding grains scattered in time,
  // drawn from pixels of the looked-at region; saccades become sparse streaks
  function synthStochastic(ctx, bus, info, rand, events, plan){
    const {W,H,lum,edge} = info;
    for(const f of plan.fixations){
      const dwell = f.t1-f.t0;
      const n = Math.round(8 + f.edNorm*26);
      const pool = f.pix.slice(0, Math.max(1, Math.ceil(f.pix.length*0.6)));
      for(let i=0;i<n;i++){
        const idx = pool[Math.floor(rand()*pool.length)];
        const row = Math.floor(idx/W), col = idx%W;
        const f0 = freqAt(row,H)*(0.8+rand()*0.4);
        const f1 = f0*(0.6+rand()*0.9);
        const amp = (0.05+rand()*0.12)*(0.4+f.edNorm)*(0.5+lum[idx]);
        const dur = 0.15 + rand()*Math.min(dwell, 2.5);
        const gt = f.t0 + rand()*dwell*0.9;
        grain(ctx, bus, {time:gt, freq:f0, freqEnd:f1, amp, pan:clampPan((col/W)*2-1 + (rand()-0.5)*0.4), dur,
                          ring: edge[idx]>0.3 || rand()<0.3 ? 15+rand()*400 : null, tone:toneAt(info, idx)});
        events.push({t:gt, dur, x:col/W, y:row/H, amp});
      }
    }
    for(const s of plan.saccades) movementTexture(ctx, info, s, rand, events, 0.30);
  }

  // ---------------- technique: micro-polyphonic clusters ----------------
  // each fixation sustains a cluster of slightly detuned voices taken from the
  // region's brightest pixels; voices hold their pitch and fade as the gaze moves on
  function synthMicropoly(ctx, bus, info, rand, events, plan){
    const {W,H,lum} = info;
    const F = plan.fixations;
    F.forEach((f,i)=>{
      const next = F[i+1], sac = plan.saccades[i];
      const V = 6 + Math.round(f.edNorm*6);
      const top = f.pix.slice(0, Math.max(V, Math.ceil(f.pix.length*0.4)));
      const dwell = f.t1-f.t0;
      const fadeIn = Math.min(dwell*0.35, 1.8);
      for(let v=0; v<V; v++){
        const idx = top[Math.floor(rand()*top.length)];
        const row = Math.floor(idx/W), col = idx%W;
        const detune = 1 + (rand()*2-1)*0.012;
        const start = Math.max(0, f.t0 - (i>0 ? 0.4 : 0));
        const fStart = freqAt(row,H)*detune;
        const freqPts = [[start,fStart]];                     // fixed pitch: no glide during movement
        if(next) rand();                                       // (keeps the fixation sounds' random choices unchanged)
        const fadeEnd = f.t1 + (sac ? Math.min(0.8, (sac.t1-sac.t0)*0.6) : Math.min(2, dwell*0.5));
        const peak = 0.018 + DM.pow(lum[idx],1.2)*0.045;
        sustainedVoice(ctx, { t0:start, t1:fadeEnd, pan:clampPan((col/W)*2-1), freqPts, tone:toneAt(info, idx),
          gainPts:[[start,0],[f.t0+fadeIn,peak],[f.t1,peak],[fadeEnd,0]] });
        const segs = 3;
        for(let s=0;s<segs;s++) events.push({t:f.t0+dwell*s/segs, dur:dwell/segs, x:col/W, y:row/H, amp:peak});
      }
    });
    for(const s of plan.saccades) movementTexture(ctx, info, s, rand, events, 0.30);
  }

  // ---------------- technique: chance operations ----------------
  // WHERE the eye looks is still the gaze plan; WHICH pixel within the
  // looked-at region sounds, and when, is left to (seeded) chance
  function synthChance(ctx, bus, info, rand, events, plan){
    const {W,H,lum} = info;
    for(const f of plan.fixations){
      let t = f.t0 + rand()*0.3;
      while(t < f.t1){
        const idx = f.pix[Math.floor(rand()*f.pix.length)];
        const row = Math.floor(idx/W), col = idx%W;
        const dur = 0.3 + rand()*Math.min(3, (f.t1-f.t0));
        const amp = (0.05 + rand()*0.18)*(0.5+lum[idx]);
        const pan = clampPan((col/W)*2-1);
        const hz = freqAt(row,H), type = rand(), tn = toneAt(info, idx);
        if(type<0.4) noiseGrain(ctx, bus, rand, {time:t, dur, amp:amp*0.5, pan, filterHz:hz, filterQ:0.7 + 6*tn[2], type:'bandpass'});
        else if(type<0.7) noiseGrain(ctx, bus, rand, {time:t, dur, amp:amp*0.4, pan, filterHz:Math.max(60,hz*0.3), filterQ:0.5, type:'lowpass'});
        else grain(ctx, bus, {time:t, freq:hz, amp:amp*0.3, pan, dur:Math.min(dur,1.2), tone:tn});
        events.push({t, dur, x:col/W, y:row/H, amp});
        t += -DM.log(1-rand())*0.9;
      }
    }
    for(const s of plan.saccades) movementTexture(ctx, info, s, rand, events, 0.30);
  }

  const STYLES = { pointillist:synthPointillist, stochastic:synthStochastic, micropoly:synthMicropoly, chance:synthChance };

  // ---------------- render ----------------
  async function synthesize(info, onProgress){
    F_MIN = info.fMin; F_MAX = info.fMax;
    const mix = makeMix(info.duration + 2.5);
    const rand = mulberry32(info.seed);
    const events = [];
    const plan = buildGazePlan(info);
    const track = plan.track;
    STYLES[info.style](mix, null, info, rand, events, plan);
    events.sort((a,b)=>a.t-b.t);
    await renderJobs(mix, onProgress);
    await placeMovement(mix, track);

    // every technique is brought to the same peak level (-0.9 dBFS), up or down
    let peak = 0;
    for(let i=0;i<mix.n;i++){ const a=Math.abs(mix.L[i]), b=Math.abs(mix.R[i]); if(a>peak) peak=a; if(b>peak) peak=b; }
    if(peak > 1e-9){
      const g = 0.9/peak;
      for(let i=0;i<mix.n;i++){ mix.L[i]*=g; mix.R[i]*=g; }
    }
    const pcm = { sampleRate:SR, length:mix.n, duration:mix.n/SR, numberOfChannels:2, L:mix.L, R:mix.R,
                  getChannelData(c){ return c===0 ? this.L : this.R; } };
    return { pcm, events, track };
  }

  // ================= delivery: MP3 + MP4 =================
  const yieldUI = ()=>new Promise(r=>{ const ch=new MessageChannel(); ch.port1.onmessage=()=>r(); ch.port2.postMessage(0); });
  function makeYielder(budgetMs){
    let last = performance.now();
    return async ()=>{ if(performance.now()-last > budgetMs){ await yieldUI(); last = performance.now(); } };
  }

  // MP3: the reference LAME encoder compiled to WebAssembly (embedded in
  // this file). WebAssembly arithmetic is identical in every browser, so the
  // same audio always gives the same MP3 bytes. A pure-JS LAME port is kept
  // only as a fallback if WebAssembly is unavailable.
  let wasmBytes = null;
  function mp3Wasm(){
    if(!wasmBytes && G.MP3_WASM_B64){
      const bin = atob(G.MP3_WASM_B64); wasmBytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) wasmBytes[i] = bin.charCodeAt(i);
    }
    return wasmBytes;
  }
  async function encodeMp3(pcm, onProgress){
    const L = pcm.getChannelData(0), R = pcm.getChannelData(1), n = L.length;
    const maybeYield = makeYielder(30);
    if(G.WasmMediaEncoder && mp3Wasm()){
      try{
        const enc = await G.WasmMediaEncoder.createEncoder('audio/mpeg', mp3Wasm());
        enc.configure({ sampleRate:pcm.sampleRate, channels:2, bitrate:192 });
        const parts = [], CH = 1152*32;
        for(let i=0;i<n;i+=CH){
          const out = enc.encode([L.subarray(i, Math.min(n, i+CH)), R.subarray(i, Math.min(n, i+CH))]);
          if(out.length) parts.push(out.slice());
          if(onProgress) onProgress(i/n);
          await maybeYield();
        }
        const last = enc.finalize(); if(last.length) parts.push(last.slice());
        return { blob:new Blob(parts, {type:'audio/mpeg'}), encoder:'wasm' };
      }catch(err){ /* fall through to the JS encoder */ }
    }
    const enc = new G.lamejs.Mp3Encoder(2, pcm.sampleRate, 192);
    const BLOCK = 1152, chunks = [];
    const l16 = new Int16Array(BLOCK), r16 = new Int16Array(BLOCK);
    for(let i=0;i<n;i+=BLOCK){
      const m = Math.min(BLOCK, n-i);
      for(let k=0;k<m;k++){
        const a = Math.max(-1, Math.min(1, L[i+k])), b = Math.max(-1, Math.min(1, R[i+k]));
        l16[k] = a<0 ? a*32768 : a*32767; r16[k] = b<0 ? b*32768 : b*32767;
      }
      const out = enc.encodeBuffer(l16.subarray(0,m), r16.subarray(0,m));
      if(out.length) chunks.push(new Uint8Array(out));
      if(onProgress) onProgress(i/n);
      await maybeYield();
    }
    const tail = enc.flush(); if(tail.length) chunks.push(new Uint8Array(tail));
    return { blob:new Blob(chunks, {type:'audio/mpeg'}), encoder:'js' };
  }

  // ---- per-frame analysis shared by both video paths ----
  function prepareFrames(buffer, events, track, FPS){
    const nF = Math.ceil(buffer.duration*FPS);
    const L = buffer.getChannelData(0), R = buffer.numberOfChannels>1 ? buffer.getChannelData(1) : L;
    const sr = buffer.sampleRate, NFFT = 2048;
    const win = new Float64Array(NFFT); for(let i=0;i<NFFT;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(NFFT-1));
    const BARS = 64, fLo = 50, fHi = 5200, binHz = sr/NFFT;   // the range the synthesis actually occupies
    const bandEdges = []; for(let b=0;b<=BARS;b++) bandEdges.push(fLo*Math.pow(fHi/fLo, b/BARS));
    const eq = new Float32Array(nF*BARS), peaks = new Float32Array(nF*BARS), rms = new Float32Array(nF);
    const re = new Float64Array(NFFT), im = new Float64Array(NFFT);
    const cur = new Float32Array(BARS), pk = new Float32Array(BARS), pkV = new Float32Array(BARS);
    let rmsMax = 1e-6;
    for(let f=0; f<nF; f++){
      const c0 = Math.round((f/FPS)*sr) - NFFT/2;
      let e2 = 0;
      for(let i=0;i<NFFT;i++){
        const j = c0+i;
        const s = (j>=0 && j<L.length) ? 0.5*(L[j]+R[j]) : 0;
        re[i] = s*win[i]; im[i] = 0; e2 += s*s;
      }
      rms[f] = Math.sqrt(e2/NFFT); if(rms[f]>rmsMax) rmsMax = rms[f];
      fft1d(re, im, false);
      for(let b=0;b<BARS;b++){
        const k0 = Math.max(1, Math.floor(bandEdges[b]/binHz));
        const k1 = Math.max(k0+1, Math.ceil(bandEdges[b+1]/binHz));
        let m = 0; for(let k=k0; k<k1 && k<NFFT/2; k++){ const a = Math.hypot(re[k], im[k]); if(a>m) m=a; }
        const db = 20*Math.log10(m/(NFFT/4) + 1e-9);
        let v = (db+72)/62; v = v<0 ? 0 : (v>1 ? 1 : v);
        v = Math.min(1, v*(0.85 + 0.3*b/BARS));
        cur[b] = v>cur[b] ? cur[b] + (v-cur[b])*0.65 : cur[b]*0.86 + v*0.14;
        if(cur[b] >= pk[b]){ pk[b] = cur[b]; pkV[b] = 0; }
        else { pkV[b] += 0.0022; pk[b] = Math.max(cur[b], pk[b]-pkV[b]); }
        eq[f*BARS+b] = cur[b]; peaks[f*BARS+b] = pk[b];
      }
    }
    for(let f=0; f<nF; f++) rms[f] /= rmsMax;

    // ---- halo path: the gaze track itself, or (other techniques) the
    //      loudness-weighted centre of whatever is sounding, smoothed ----
    const tx = new Float32Array(nF), ty = new Float32Array(nF), tr = new Float32Array(nF), ti = new Float32Array(nF);
    if(track && track.length){
      let s = 0;
      const last = track[track.length-1];
      for(let f=0; f<nF; f++){
        const t = f/FPS;
        while(s < track.length-1 && t >= track[s].t1) s++;
        const seg = track[s];
        if(t > last.t1){
          const lx = last.type==='dwell' ? last.x : last.x1, ly = last.type==='dwell' ? last.y : last.y1;
          tx[f]=lx; ty[f]=ly; tr[f]=0.09; ti[f]=Math.max(0, 1-(t-last.t1)/1.6);
        } else if(seg.type==='dwell'){
          tx[f]=seg.x; ty[f]=seg.y; tr[f]=0.09+0.055*Math.sqrt(seg.sal); ti[f]=1;
        } else {
          const fr = Math.min(1, Math.max(0, (t-seg.t0)/Math.max(seg.t1-seg.t0, 1e-6)));
          const e = fr*fr*(3-2*fr);
          tx[f]=seg.x0+(seg.x1-seg.x0)*e; ty[f]=seg.y0+(seg.y1-seg.y0)*e;
          tr[f]=0.08; ti[f]=1-0.35*Math.sin(Math.PI*fr);
        }
      }
    } else {
      let maxDur = 0.15; for(const ev of events) if(ev.dur>maxDur) maxDur = ev.dur;
      let lo = 0, px = 0.5, py = 0.5;
      const Es = new Float32Array(nF);
      for(let f=0; f<nF; f++){
        const t = f/FPS;
        while(lo < events.length && events[lo].t + maxDur < t) lo++;
        let sx=0, sy=0, sw=0;
        for(let i=lo; i<events.length && events[i].t<=t; i++){
          const ev = events[i], d = Math.max(ev.dur, 0.15);
          if(t > ev.t + d) continue;
          const w = (ev.amp||0.05) * Math.sin(Math.PI*(t-ev.t)/d);
          sx += ev.x*w; sy += ev.y*w; sw += w;
        }
        if(sw > 1e-5){ px = sx/sw; py = sy/sw; }
        tx[f]=px; ty[f]=py; Es[f]=sw;
      }
      let eMean=0, eN=0; for(const v of Es) if(v>1e-5){ eMean+=v; eN++; }
      eMean = eN ? eMean/eN : 1;
      for(let f=0; f<nF; f++){ const k = 1-Math.exp(-Es[f]/eMean); ti[f]=k; tr[f]=0.065+0.055*k; }
    }
    // two-stage exponential smoothing -> fluid, curved motion, no kinks
    const hx = new Float32Array(nF), hy = new Float32Array(nF), hr = new Float32Array(nF), hi = new Float32Array(nF);
    const a = (track && track.length) ? 0.22 : 0.07;
    let x1=tx[0], y1=ty[0], x2=tx[0], y2=ty[0], r1=tr[0], i1=0;
    for(let f=0; f<nF; f++){
      x1 += (tx[f]-x1)*a; y1 += (ty[f]-y1)*a; x2 += (x1-x2)*a; y2 += (y1-y2)*a;
      r1 += (tr[f]-r1)*0.08; i1 += (ti[f]-i1)*0.12;
      hx[f]=x2; hy[f]=y2; hr[f]=r1; hi[f]=i1;
    }
    return { nF, BARS, eq, peaks, rms, hx, hy, hr, hi };
  }

  function videoDims(img, maxW){
    // multiples of 16: some phones' hardware encoders fail on other sizes
    const r16 = v => Math.max(16, Math.round(v/16)*16);
    const ar = img.w / img.h;
    const VW = r16(Math.min(maxW || 1080, (maxW || 1080)*1.5*ar));
    const IH = r16(VW/ar);
    const EQ_H = r16(VW*0.25);
    return { VW, IH, EQ_H, VH: IH+EQ_H };
  }

  function makeFrameDrawer(info, events, pre, dims, FPS){
    const { VW, IH, EQ_H, VH } = dims;
    const cv = makeCanvas(VW, VH);
    const g = cv.getContext('2d', { alpha:false });
    const base = makeCanvas(VW, IH);
    const bg = base.getContext('2d');
    if(info.videoBase){                                        // already at video size (parallel segments)
      bg.putImageData(new ImageData(info.videoBase, VW, IH), 0, 0);
    } else {
      const src = makeCanvas(info.image.w, info.image.h);
      src.getContext('2d').putImageData(new ImageData(info.image.data, info.image.w, info.image.h), 0, 0);
      bg.imageSmoothingQuality = 'high';
      bg.drawImage(src, 0, 0, VW, IH);
    }
    const MIN = Math.min(VW, IH);
    let maxDur = 0.15; for(const ev of events) if(ev.dur>maxDur) maxDur = ev.dur;
    let evLo = 0;

    function glow(x, y, r, stops){
      if(r <= 0.5) return;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      for(const [o, col] of stops) gr.addColorStop(o, col);
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    }

    // gaze lens: inside a soft-edged circle the image is shown inverted,
    // ringed by a blurred red edge. The inverted copy is made once.
    const invC = makeCanvas(VW, IH);
    const ig = invC.getContext('2d');
    ig.drawImage(base, 0, 0);
    ig.globalCompositeOperation = 'difference'; ig.fillStyle = '#ffffff'; ig.fillRect(0, 0, VW, IH);
    ig.globalCompositeOperation = 'source-over';
    let hrMax = 0; for(let i=0;i<pre.nF;i++) if(pre.hr[i]>hrMax) hrMax = pre.hr[i];
    const LENS_K = 1.45;
    const LD = Math.ceil(hrMax*MIN*1.2*LENS_K*2) + 4;   // lens canvas (glow is drawn directly, not here)
    const lens = makeCanvas(LD, LD);
    const lg = lens.getContext('2d');
    const MASK = (()=>{ const d = 512, mc = makeCanvas(d, d), mx = mc.getContext('2d');
      const mg = mx.createRadialGradient(d/2, d/2, 0, d/2, d/2, d/2);
      // soft edge: the inversion fades out along a smooth (s-shaped) curve
      [[0,1],[0.5,1],[0.62,0.9],[0.74,0.62],[0.86,0.3],[0.94,0.1],[1,0]].forEach(([o,a])=>mg.addColorStop(o, `rgba(0,0,0,${a})`));
      mx.fillStyle = mg; mx.fillRect(0, 0, d, d); return mc; })();

    // particle-wave equaliser: braided strands of light particles. The
    // spectrum runs along the width (low frequencies left, high right): the
    // louder a band, the wider the strands swing there and the more particles
    // scatter off them. The particle set comes from a fixed seed, so it is
    // identical in every frame and every render - only the sound moves it.
    const cy = IH + EQ_H/2, hMax = EQ_H*0.40;
    const pr = mulberry32(0x51A7E5);
    const STRANDS = 3, PER = 190, LOOSE = 200;
    // each strand gets its own slow, non-repeating motion (fixed seed)
    const ST = [];
    for(let s=0;s<STRANDS;s++) ST.push({ k:1.0+pr()*0.3, w1:0.32+pr()*0.22, w2:0.11+pr()*0.12,
                                         p1:(pr()-0.5)*0.9, p2:pr()*6.2832, w3:0.17+pr()*0.14 });
    const P = [];
    for(let s=0;s<STRANDS;s++) for(let i=0;i<PER;i++)
      P.push({ s, u:pr(), j:pr()*2-1, sz:pr(), a:pr(), sp:0.6+pr()*0.8, loose:false });
    for(let i=0;i<LOOSE;i++)
      P.push({ s:Math.floor(pr()*STRANDS), u:pr(), j:(pr()*2-1)*(1+pr()*2.2), sz:pr(), a:pr(), sp:0.6+pr()*0.8, loose:true });
    const SPR = [0.4, 0.6, 0.85, 1.2].map(r=>{
      const d = Math.ceil(r*4)+2, sc = makeCanvas(d, d);
      const sx = sc.getContext('2d'), gr = sx.createRadialGradient(d/2,d/2,0,d/2,d/2,r*2);
      gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.55,'rgba(255,255,255,0.95)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      sx.fillStyle = gr; sx.fillRect(0,0,d,d);
      return { c:sc, d };
    });
    // one pre-rendered speck (same gradient as before), scaled per speck
    const SPECK = (()=>{ const d = 64, sc = makeCanvas(d, d), sx = sc.getContext('2d');
      const gr = sx.createRadialGradient(d/2, d/2, 0, d/2, d/2, d/2);
      gr.addColorStop(0, 'rgba(255,225,205,0.75)'); gr.addColorStop(0.35, 'rgba(255,120,90,0.35)'); gr.addColorStop(1, 'rgba(255,90,60,0)');
      sx.fillStyle = gr; sx.fillRect(0, 0, d, d); return sc; })();
    // The strip is computed as pixels: each particle adds its soft dot (same
    // radial profile as a sprite: 1 at the centre, 0.95 at 55% radius, 0 at
    // the edge) straight into a light buffer at its exact sub-pixel position.
    // White additive light on black needs no canvas compositing at all.
    const DOT_R = [0.4, 0.6, 0.85, 1.2].map(r => r*2);
    const eqLight = new Float32Array(VW*EQ_H);
    const eqImg = new ImageData(VW, EQ_H), eqPx32 = new Uint32Array(eqImg.data.buffer);
    const LE = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;   // byte order
    function addDot(x, y, rad0, a){
      // at least ~one pixel wide (no shimmer of sub-pixel dots), same total light
      const rad = Math.sqrt(rad0*rad0 + 0.36);
      a *= (rad0*rad0)/(rad*rad);
      const yy = y - IH;
      const x0 = Math.max(0, Math.floor(x - rad)), x1 = Math.min(VW-1, Math.ceil(x + rad));
      const y0 = Math.max(0, Math.floor(yy - rad)), y1 = Math.min(EQ_H-1, Math.ceil(yy + rad));
      for(let py=y0; py<=y1; py++){
        const dy = py + 0.5 - yy, row = py*VW;
        for(let px=x0; px<=x1; px++){
          const dx = px + 0.5 - x, rn = Math.sqrt(dx*dx + dy*dy)/rad;
          if(rn >= 1) continue;
          const prof = rn < 0.55 ? 1 - 0.05*rn/0.55 : 0.95*(1 - rn)/0.45;
          eqLight[row + px] += a*prof;
        }
      }
    }
    const NS = 160, E = new Float32Array(NS), E2 = new Float32Array(NS);
    const KR = 14, KS = 6.5, KW = [];                   // gaussian across ~4% of the width
    { let sum=0; for(let i=-KR;i<=KR;i++){ const w=Math.exp(-(i*i)/(2*KS*KS)); KW.push(w); sum+=w; } for(let i=0;i<KW.length;i++) KW[i]/=sum; }

    function draw(f){
      const t = f/FPS;
      g.globalCompositeOperation = 'source-over';
      g.drawImage(base, 0, 0);

      const I = pre.hi[f];
      const breath = 1 + 0.2*pre.rms[f];
      const x = pre.hx[f]*VW, y = pre.hy[f]*IH, r = pre.hr[f]*MIN*breath;

      const R = r*LENS_K;
      if(I > 0.01 && R > 2){
        const ox = x - LD/2, oy = y - LD/2;
        const bx = Math.max(0, Math.floor(LD/2 - R) - 1), bw = Math.min(LD - bx, Math.ceil(2*R) + 2);
        lg.globalCompositeOperation = 'source-over';
        lg.clearRect(bx, bx, bw, bw);
        lg.globalAlpha = I;
        lg.drawImage(MASK, LD/2 - R, LD/2 - R, 2*R, 2*R);
        lg.globalAlpha = 1;
        lg.globalCompositeOperation = 'source-in';
        lg.drawImage(invC, ox + bx, oy + bx, bw, bw, bx, bx, bw, bw);
        g.drawImage(lens, bx, bx, bw, bw, ox + bx, oy + bx, bw, bw);
      }
      g.globalCompositeOperation = 'screen';
      // light specks: each grain sounding at this instant, where it was taken from
      while(evLo < events.length && events[evLo].t + maxDur < t) evLo++;
      let drawn = 0;
      for(let i=evLo; i<events.length && events[i].t<=t && drawn<90; i++){
        const ev = events[i], d = Math.max(ev.dur, 0.12);
        if(t > ev.t + d) continue;
        const env = Math.sin(Math.PI*(t-ev.t)/d);
        const a = Math.min(1, 0.25 + (ev.amp||0.05)*2.2) * env;
        if(a < 0.04) continue;
        const sx = ev.x*VW, sy = ev.y*IH, sr = (1.2 + (ev.amp||0.05)*7)*3;
        g.globalAlpha = a;
        g.drawImage(SPECK, sx - sr, sy - sr, sr*2, sr*2);
        drawn++;
      }
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';

      // particle-wave equaliser
      g.globalAlpha = 1;
      eqLight.fill(0);
      const B = pre.BARS, b0f = f*B, rm = pre.rms[f];
      for(let k=0;k<NS;k++){
        const pos = k/(NS-1)*(B-1), b0 = Math.floor(pos), fr = pos-b0;
        E[k] = pre.eq[b0f+b0]*(1-fr) + pre.eq[b0f+Math.min(B-1,b0+1)]*fr;
      }
      for(let k=0;k<NS;k++){                          // smooth: curves, never kinks
        let s=0; for(let i=-KR;i<=KR;i++){ const kk=Math.min(NS-1,Math.max(0,k+i)); s += E[kk]*KW[i+KR]; }
        E2[k]=s;
      }
      E.set(E2);
      for(let n=0; n<P.length; n++){
        const q = P[n];
        let u = q.u + t*0.012*q.sp; u -= Math.floor(u);
        const edge = Math.min(1, u/0.07, (1-u)/0.07);
        if(edge <= 0) continue;
        const e = Math.min(1, E[Math.min(NS-1, Math.round(u*(NS-1)))]*1.35 + 0.1*rm);
        const st = ST[q.s];
        const ph = 2*Math.PI*st.k*u + t*st.w1 + st.p1;   // close phases: strands braid like one ribbon
        const mod = 0.78 + 0.22*Math.sin(2*Math.PI*0.55*u + st.p2 - t*st.w2);
        let y = cy + hMax*(0.42 + 0.78*e)*Math.sin(ph)*mod       // the braid is always there; sound widens it
                   + hMax*0.12*Math.sin(2*Math.PI*0.35*u + t*st.w3 + st.p2)   // slow wander
                   + Math.sin(t*(0.6+q.a*0.9) + q.u*40)*1.1;                   // each particle's own soft drift
        let x = u*VW;
        if(q.loose){ y += q.j*(5 + 34*e); x += q.j*3; }
        else y += q.j*(1 + 9*e);
        const al = (q.loose ? 0.2+0.55*q.a : 0.35+0.65*q.a) * Math.min(1, 0.5+0.8*e) * edge;
        if(al < 0.02) continue;
        addDot(x, y, DOT_R[Math.min(3, Math.floor(q.sz*(q.loose ? 3 : 4)))], Math.min(1, al));
      }
      for(let i=0; i<eqLight.length; i++){                    // background #050505 + light, one write per pixel
        const v = 5 + eqLight[i]*250, b = v > 255 ? 255 : (v|0);
        eqPx32[i] = LE ? (0xFF000000 | (b<<16) | (b<<8) | b) >>> 0 : ((b<<24) | (b<<16) | (b<<8) | 0xFF) >>> 0;
      }
      g.putImageData(eqImg, 0, IH);
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    }
    return { canvas: cv, draw };
  }

  async function resampleTo(pcm, sr){            // cubic (Catmull-Rom) resampling
    const ratio = pcm.sampleRate/sr, n = Math.floor(pcm.length/ratio);
    const out = [new Float32Array(n), new Float32Array(n)];
    for(let ch=0; ch<2; ch++){
      const x = pcm.getChannelData(ch), y = out[ch], m = x.length;
      for(let i=0;i<n;i++){
        const t = i*ratio, k = Math.floor(t), f = t-k;
        const p0 = x[Math.max(0,k-1)], p1 = x[k], p2 = x[Math.min(m-1,k+1)], p3 = x[Math.min(m-1,k+2)];
        y[i] = p1 + 0.5*f*(p2-p0 + f*(2*p0-5*p1+4*p2-p3 + f*(3*(p1-p2)+p3-p0)));
      }
    }
    return { sampleRate:sr, length:n, duration:n/sr, numberOfChannels:2, L:out[0], R:out[1],
             getChannelData(c){ return c===0 ? this.L : this.R; } };
  }

  // Offline MP4: every frame is drawn and encoded exactly (H.264 via
  // WebCodecs) - no real-time capture, so no dropped frames or stutter.
  // Video encoding settings. The painting is mostly static, so a variable
  // bitrate (bits spent only where something moves) and sparse keyframes
  // (a full picture of the painting is expensive and rarely needed) keep the
  // file small; values chosen by measured similarity to a near-lossless render.
  // Video budget: the whole MP4 must stay under 20 MB so it can be shared
  // on social media. A constant bitrate is derived from the piece's length,
  // so the size is predictable; the file is checked after encoding and, in
  // the rare case it is still too large, encoded once more slightly lower.
  const MAX_VIDEO_BYTES = 20_000_000;                             // 20 MB as phones and apps count it
  // 720 px at 24 fps: with the 20 MB budget 720 px keeps the painting's
  // texture clearly sharper than 540 px (measured); the slow gliding motion
  // needs no more than 24 fps
  const VIDEO_ENC = { mode:'constant', fps:24, kfSec:8, audioBitrate:96000, width:720 };
  function videoBitrateFor(seconds, enc){
    const budgetBits = MAX_VIDEO_BYTES*8*0.93;                      // 7% margin for container overhead
    const v = budgetBits/seconds - enc.audioBitrate;
    return Math.max(120000, Math.min(2_500_000, Math.floor(v)));
  }

  function withTimeout(promise, ms, what){
    return Promise.race([promise, new Promise((_, rej)=>setTimeout(()=>rej(new Error(what + ' timed out')), ms))]);
  }
  // The device's dedicated video hardware is asked for first (several times
  // faster); without it the software encoder is used, exactly as before.
  async function pickVideoConfig(dims, FPS, enc){
    for(const accel of ['prefer-hardware', undefined]){
      for(const codec of ['avc1.640028','avc1.4D0028','avc1.42E028']){
        for(const mode of [enc.mode, undefined]){               // some encoders reject an explicit mode
          const c = { codec, width:dims.VW, height:dims.VH, bitrate:enc.bitrate, framerate:FPS, avc:{format:'avc'} };
          if(mode) c.bitrateMode = mode;
          if(accel) c.hardwareAcceleration = accel;
          try{ if((await VideoEncoder.isConfigSupported(c)).supported) return c; }catch(e){}
        }
      }
    }
    return null;
  }

  async function renderMp4Offline(buffer, drawer, pre, dims, FPS, onProgress, enc, vcfg){
    enc = Object.assign({}, VIDEO_ENC, enc || {});
    if(!vcfg) vcfg = await pickVideoConfig(dims, FPS, enc);
    if(!vcfg) throw new Error('no H.264 encoder');
    let acfg = null, aMux = null;
    for(const [codec, sr, mux] of [['mp4a.40.2', buffer.sampleRate, 'aac'], ['mp4a.40.2', 48000, 'aac'], ['opus', 48000, 'opus']]){
      const c = { codec, sampleRate:sr, numberOfChannels:2, bitrate:enc.audioBitrate };
      try{ if((await AudioEncoder.isConfigSupported(c)).supported){ acfg = c; aMux = mux; break; } }catch(e){}
    }
    if(!acfg) throw new Error('no audio encoder');
    const aBuf = acfg.sampleRate === buffer.sampleRate ? buffer : await resampleTo(buffer, acfg.sampleRate);

    const muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec:'avc', width:dims.VW, height:dims.VH, frameRate:FPS },
      audio: { codec:aMux, sampleRate:acfg.sampleRate, numberOfChannels:2 },
      fastStart: 'in-memory',
      firstTimestampBehavior: 'offset',
    });
    let encErr = null;

    const ae = new AudioEncoder({ output:(ch, meta)=>muxer.addAudioChunk(ch, meta), error:e=>{ encErr = e; } });
    ae.configure(acfg);
    const L = aBuf.getChannelData(0), R = aBuf.numberOfChannels>1 ? aBuf.getChannelData(1) : L;
    const CH = 4096;
    for(let i=0; i<L.length; i+=CH){
      const n = Math.min(CH, L.length-i);
      const data = new Float32Array(n*2); data.set(L.subarray(i, i+n), 0); data.set(R.subarray(i, i+n), n);
      const ad = new AudioData({ format:'f32-planar', sampleRate:acfg.sampleRate, numberOfFrames:n, numberOfChannels:2,
                                 timestamp:Math.round(i*1e6/acfg.sampleRate), data });
      ae.encode(ad); ad.close();
      if(ae.encodeQueueSize > 24) await yieldUI();
    }
    await withTimeout(ae.flush(), 30000, 'audio flush'); ae.close();
    if(encErr) throw encErr;

    const ve = new VideoEncoder({ output:(ch, meta)=>muxer.addVideoChunk(ch, meta), error:e=>{ encErr = e; } });
    ve.configure(vcfg);
    const maybeYield = makeYielder(24);
    for(let f=0; f<pre.nF; f++){
      if(encErr) throw encErr;
      drawer.draw(f);
      const vf = new VideoFrame(drawer.canvas, { timestamp:Math.round(f*1e6/FPS), duration:Math.round(1e6/FPS) });
      ve.encode(vf, { keyFrame: f % Math.round(FPS*enc.kfSec) === 0 });
      vf.close();
      // wait for the encoder to catch up, but never forever (some phone
      // encoders report their queue late)
      for(let waited=0; ve.encodeQueueSize > 6 && waited < 4000; waited += 4) await new Promise(r=>setTimeout(r, 4));
      if(ve.encodeQueueSize > 6) throw new Error('video encoder stalled');   // give up instead of crawling
      onProgress(f/pre.nF);
      await maybeYield();
    }
    await withTimeout(ve.flush(), 30000, 'video flush'); ve.close();
    if(encErr) throw encErr;
    muxer.finalize();
    return { blob: new Blob([muxer.target.buffer], {type:'video/mp4'}), ext:'mp4', audioCodec:aMux, codec:vcfg.codec, w:dims.VW, h:dims.VH };
  }

  // Fallback for browsers without WebCodecs: the same frames, captured
  // while the audio plays silently (routed only to the recorder).
  function renderRealtime(buffer, drawer, pre, FPS, onProgress, sharedCtx){
    return new Promise((resolve, reject)=>{
      const actx = sharedCtx || new (window.AudioContext||window.webkitAudioContext)();
      const own = !sharedCtx;
      // Safari only captures a canvas that is in the document
      const cv = drawer.canvas;
      if(cv.style){ cv.style.cssText = 'position:fixed;left:-99999px;top:0;width:2px;height:2px;pointer-events:none;'; document.body.appendChild(cv); }
      const done = ()=>{ if(own) actx.close(); if(cv.parentNode) cv.parentNode.removeChild(cv); };
      const ab = actx.createBuffer(2, buffer.length, buffer.sampleRate);
      ab.copyToChannel(buffer.getChannelData(0), 0); ab.copyToChannel(buffer.getChannelData(1), 1);
      const src = actx.createBufferSource(); src.buffer = ab;
      const dest = actx.createMediaStreamDestination();
      src.connect(dest);
      const keepAlive = actx.createGain(); keepAlive.gain.value = 0;
      src.connect(keepAlive); keepAlive.connect(actx.destination);
      const vs = drawer.canvas.captureStream(FPS);
      dest.stream.getAudioTracks().forEach(tk=>vs.addTrack(tk));
      const mime = ['video/mp4;codecs=avc1.42E01F,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm']
        .find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m));
      if(!mime){ done(); reject(new Error('no recorder')); return; }
      const rec = new MediaRecorder(vs, { mimeType:mime, videoBitsPerSecond:videoBitrateFor(buffer.duration, VIDEO_ENC), audioBitsPerSecond:VIDEO_ENC.audioBitrate });
      const chunks = [];
      rec.ondataavailable = ev=>{ if(ev.data.size) chunks.push(ev.data); };
      rec.onstop = ()=>{ done(); resolve({ blob:new Blob(chunks, {type:mime.split(';')[0]}), ext: mime.startsWith('video/mp4') ? 'mp4' : 'webm' }); };
      rec.onerror = err=>{ done(); reject(err); };
      let raf;
      const loop = ()=>{
        const f = Math.min(pre.nF-1, Math.floor(actx.currentTime*FPS));
        drawer.draw(f); onProgress(actx.currentTime/buffer.duration);
        raf = requestAnimationFrame(loop);
      };
      // a context that the browser keeps locked must not hang the piece
      const resumed = actx.state === 'running' ? Promise.resolve() : Promise.race([actx.resume(), new Promise((_,r)=>setTimeout(()=>r(new Error('audio locked')), 4000))]);
      resumed.then(()=>{
        if(actx.state !== 'running') throw new Error('audio locked');
        drawer.draw(0); rec.start(); src.start(); loop();
      }).catch(err=>{ done(); reject(err); });
      src.onended = ()=>{ cancelAnimationFrame(raf); setTimeout(()=>rec.stop(), 150); };
    });
  }

  function canRenderOffline(){
    return typeof VideoEncoder !== 'undefined' && typeof AudioEncoder !== 'undefined' && !!G.Mp4Muxer &&
           (typeof document !== 'undefined' || typeof OffscreenCanvas !== 'undefined');
  }
  async function renderVideoOffline(pcm, info, events, track, onProgress, enc, maxW){
    const e = Object.assign({}, VIDEO_ENC, enc || {}), FPS = e.fps;
    if(!e.bitrate) e.bitrate = videoBitrateFor(pcm.duration, e);
    let dims = null, vcfg = null;
    for(const w of [Math.min(maxW || e.width, e.width), 540, 480]){   // largest size this device can encode
      dims = videoDims(info.image, w);
      vcfg = await pickVideoConfig(dims, FPS, e);
      if(vcfg) break;
    }
    if(!vcfg) throw new Error('no H.264 encoder');
    await yieldUI();
    const pre = prepareFrames(pcm, events, track, FPS);
    await yieldUI();
    const drawer = makeFrameDrawer(info, events, pre, dims, FPS);
    let v = await renderMp4Offline(pcm, drawer, pre, dims, FPS, onProgress, e, vcfg);
    if(v.blob.size > MAX_VIDEO_BYTES){                        // rare: encode once more, proportionally lower
      const e2 = Object.assign({}, e, { bitrate: Math.floor(e.bitrate * (MAX_VIDEO_BYTES*0.9)/v.blob.size) });
      const vcfg2 = Object.assign({}, vcfg, { bitrate:e2.bitrate });
      const pre2 = prepareFrames(pcm, events, track, FPS), d2 = makeFrameDrawer(info, events, pre2, dims, FPS);
      v = await renderMp4Offline(pcm, d2, pre2, dims, FPS, p=>onProgress(0.98 + 0.02*p), e2, vcfg2);
    }
    return v;
  }
  function renderVideoRealtime(pcm, info, events, track, onProgress, actx, maxW){
    const FPS = 30, dims = videoDims(info.image, Math.min(maxW || 1080, 720));
    const pre = prepareFrames(pcm, events, track, FPS);
    const drawer = makeFrameDrawer(info, events, pre, dims, FPS);
    return renderRealtime(pcm, drawer, pre, FPS, onProgress, actx);
  }

  // ================= parallel pipeline =================
  // PREPARE: everything the video and audio need, in one worker.
  async function prepareJob(bytes, mime, emit, opts){
    opts = opts || {};
    const img = await decodeImage(bytes, mime);
    emit(0.03);
    const info = analyze(img);
    emit(0.04);
    const { pcm, events, track } = await synthesize(info, p=>emit(0.04 + 0.08*p));
    emit(0.12);
    const e = Object.assign({}, VIDEO_ENC), FPS = e.fps;
    e.bitrate = videoBitrateFor(pcm.duration, e);
    let dims = null, vcfg = null;
    for(const w of [Math.min(opts.maxVideoWidth || e.width, e.width), 540, 480]){
      dims = videoDims(info.image, w);
      vcfg = await pickVideoConfig(dims, FPS, e);
      if(vcfg) break;
    }
    if(!vcfg) throw new Error('no H.264 encoder');
    const pre = prepareFrames(pcm, events, track, FPS);
    emit(0.15);
    // base image at video size, drawn once here instead of in every segment
    const src = makeCanvas(info.image.w, info.image.h);
    src.getContext('2d').putImageData(new ImageData(info.image.data, info.image.w, info.image.h), 0, 0);
    const bc = makeCanvas(dims.VW, dims.IH), bx = bc.getContext('2d');
    bx.imageSmoothingQuality = 'high'; bx.drawImage(src, 0, 0, dims.VW, dims.IH);
    const videoBase = new Uint8ClampedArray(bx.getImageData(0, 0, dims.VW, dims.IH).data);
    emit(0.16);
    const id = (info.seed >>> 0).toString(16).padStart(8,'0').slice(0,6);
    return { style:info.style, seed:info.seed, id, duration:info.duration, exact:img.exact, metrics:info.metrics,
             L:pcm.L, R:pcm.R, sampleRate:pcm.sampleRate, events, track, pre, dims, FPS, vcfg, enc:e, videoBase };
  }

  // AUDIO: the MP3 and the MP4's audio track, together (runs beside the video)
  async function audioJob(L, R, sampleRate, enc, emit, opts){
    opts = opts || {};
    const pcm = { sampleRate, length:L.length, duration:L.length/sampleRate, numberOfChannels:2, L, R,
                  getChannelData(c){ return c ? this.R : this.L; } };
    // the play-only edition needs no MP3: its sound plays from the film's own audio track
    const mp3 = opts.noMp3 ? { blob:null, encoder:null } : await encodeMp3(pcm, p=>emit(0.7*p));
    let acfg = null, aMux = null;
    for(const [codec, sr, mux] of [['mp4a.40.2', sampleRate, 'aac'], ['mp4a.40.2', 48000, 'aac'], ['opus', 48000, 'opus']]){
      const c = { codec, sampleRate:sr, numberOfChannels:2, bitrate:enc.audioBitrate };
      try{ if((await AudioEncoder.isConfigSupported(c)).supported){ acfg = c; aMux = mux; break; } }catch(e){}
    }
    if(!acfg) throw new Error('no audio encoder');
    const aBuf = acfg.sampleRate === sampleRate ? pcm : await resampleTo(pcm, acfg.sampleRate);
    const chunks = []; let meta = null, err = null;
    const ae = new AudioEncoder({ output:(ch, m)=>{ const d = new ArrayBuffer(ch.byteLength); ch.copyTo(d);
                                    chunks.push({ data:d, type:ch.type, timestamp:ch.timestamp, duration:ch.duration });
                                    if(m && m.decoderConfig && !meta) meta = m; },
                                  error:e=>{ err = e; } });
    ae.configure(acfg);
    const AL = aBuf.getChannelData(0), AR = aBuf.getChannelData(1), CH = 4096;
    for(let i=0;i<AL.length;i+=CH){
      const n = Math.min(CH, AL.length-i), data = new Float32Array(n*2);
      data.set(AL.subarray(i,i+n), 0); data.set(AR.subarray(i,i+n), n);
      const ad = new AudioData({ format:'f32-planar', sampleRate:acfg.sampleRate, numberOfFrames:n, numberOfChannels:2,
                                 timestamp:Math.round(i*1e6/acfg.sampleRate), data });
      ae.encode(ad); ad.close();
      if(ae.encodeQueueSize > 24) await yieldUI();
    }
    await withTimeout(ae.flush(), 30000, 'audio flush'); ae.close();
    if(err) throw err;
    emit(1);
    return { mp3:mp3.blob, mp3Encoder:mp3.encoder,
             track:{ codec:aMux, sampleRate:acfg.sampleRate, chunks, meta:plainMeta(meta) } };
  }
  function plainMeta(m){
    if(!m || !m.decoderConfig) return m || null;
    const dc = Object.assign({}, m.decoderConfig);
    if(dc.description){ const d = dc.description; dc.description = d.buffer ? d.buffer.slice(d.byteOffset, d.byteOffset+d.byteLength) : d.slice(0); }
    return { decoderConfig: dc };
  }

  // SEGMENT: draws and encodes frames [f0, f1) - several run at once
  async function segmentJob(job, emit, report){
    const { pre, events, dims, FPS, vcfg, enc, f0, f1 } = job;
    let videoBase = job.videoBase;
    if(job.baseW !== dims.VW || job.baseH !== dims.IH){       // a smaller size was chosen for this device
      const s = makeCanvas(job.baseW, job.baseH); s.getContext('2d').putImageData(new ImageData(videoBase, job.baseW, job.baseH), 0, 0);
      const d = makeCanvas(dims.VW, dims.IH), dx = d.getContext('2d'); dx.imageSmoothingQuality = 'high';
      dx.drawImage(s, 0, 0, dims.VW, dims.IH);
      videoBase = new Uint8ClampedArray(dx.getImageData(0, 0, dims.VW, dims.IH).data);
    }
    const drawer = makeFrameDrawer({ videoBase }, events, pre, dims, FPS);
    const PROBE = Math.min(f1 - f0, Math.round(FPS*4)), tStart = performance.now();
    let probed = !report;
    const chunks = []; let meta = null, err = null;
    const ve = new VideoEncoder({ output:(ch, m)=>{ const d = new ArrayBuffer(ch.byteLength); ch.copyTo(d);
                                    chunks.push({ data:d, type:ch.type, timestamp:ch.timestamp, duration:ch.duration });
                                    if(m && m.decoderConfig && !meta) meta = m; },
                                  error:e=>{ err = e; } });
    ve.configure(vcfg);
    const kf = Math.round(FPS*enc.kfSec), maybeYield = makeYielder(24);
    for(let f=f0; f<f1; f++){
      if(err) throw err;
      drawer.draw(f);
      const vf = new VideoFrame(drawer.canvas, { timestamp:Math.round(f*1e6/FPS), duration:Math.round(1e6/FPS) });
      ve.encode(vf, { keyFrame: f === f0 || f % kf === 0 });     // every segment starts on a keyframe
      vf.close();
      for(let waited=0; ve.encodeQueueSize > 6 && waited < 4000; waited += 4) await new Promise(r=>setTimeout(r, 4));
      if(ve.encodeQueueSize > 6) throw new Error('video encoder stalled');
      if(((f - f0) & 7) === 0) emit((f - f0)/(f1 - f0));
      if(!probed && f - f0 + 1 >= PROBE){
        // after ~4 s of video: how big and how slow is this device's encoder really?
        probed = true;
        await new Promise(r=>setTimeout(r, 50));
        let kb = 0, kn = 0, db = 0, dn = 0;
        for(const ch of chunks){ if(ch.type === 'key'){ kb += ch.data.byteLength; kn++; } else { db += ch.data.byteLength; dn++; } }
        const n = f1 - f0, targetPerFrame = enc.bitrate/8/FPS;
        // ordinary (delta) frames vs the target: a well-behaved encoder stays at or
        // below it (it saves for the keyframe); one that ignores bitrate shows above
        report({ overshoot: dn ? (db/dn)/targetPerFrame : 1, msPerFrame: (performance.now() - tStart)/(f - f0 + 1), framesLeft: n - (f - f0 + 1) });
      }
      await maybeYield();
    }
    await withTimeout(ve.flush(), 30000, 'video flush'); ve.close();
    if(err) throw err;
    emit(1);
    return { f0, f1, chunks, meta:plainMeta(meta) };
  }

  // MUX: segments in order + audio track -> one MP4. Segments must share the
  // encoder's parameter sets; if they don't, the caller falls back.
  function sameBytes(a, b){
    if(!a || !b) return a === b;
    const x = new Uint8Array(a), y = new Uint8Array(b);
    if(x.length !== y.length) return false;
    for(let i=0;i<x.length;i++) if(x[i] !== y[i]) return false;
    return true;
  }
  function muxParallel(dims, FPS, audio, segments){
    const d0 = segments[0].meta && segments[0].meta.decoderConfig && segments[0].meta.decoderConfig.description;
    for(const s of segments){
      const d = s.meta && s.meta.decoderConfig && s.meta.decoderConfig.description;
      if(!sameBytes(d0, d)) throw new Error('segments use different encoder parameters');
    }
    const muxer = new G.Mp4Muxer.Muxer({
      target: new G.Mp4Muxer.ArrayBufferTarget(),
      video: { codec:'avc', width:dims.VW, height:dims.VH, frameRate:FPS },
      audio: { codec:audio.codec, sampleRate:audio.sampleRate, numberOfChannels:2 },
      fastStart: 'in-memory', firstTimestampBehavior: 'offset',
    });
    let first = true;
    for(const s of segments) for(const ch of s.chunks){
      muxer.addVideoChunkRaw(new Uint8Array(ch.data), ch.type, ch.timestamp, ch.duration, first ? s.meta : undefined);
      first = false;
    }
    let firstA = true;
    for(const ch of audio.chunks){
      muxer.addAudioChunkRaw(new Uint8Array(ch.data), ch.type, ch.timestamp, ch.duration, firstA ? audio.meta : undefined);
      firstA = false;
    }
    muxer.finalize();
    return new Blob([muxer.target.buffer], { type:'video/mp4' });
  }

  // The whole piece, from file bytes to files. Runs in a background worker
  // when possible (the page stays smooth), otherwise in the page itself.
  // emit(p) reports progress 0..1. If offline video encoding is not
  // available here, the result carries what the page needs to record it.
  async function run(bytes, mime, emit, opts){
    opts = opts || {};
    const img = await decodeImage(bytes, mime);
    emit(0.03);
    const info = analyze(img);
    emit(0.04);
    const { pcm, events, track } = await synthesize(info, p=>emit(0.04 + 0.06*p));
    emit(0.10);
    const mp3 = await encodeMp3(pcm, p=>emit(0.10 + 0.06*p));
    emit(0.16);
    const id = (info.seed >>> 0).toString(16).padStart(8,'0').slice(0,6);
    // the MP3 is handed over now, so the audio survives even if video fails
    if(opts.onAudio) opts.onAudio({ style:info.style, id, mp3:mp3.blob, mp3Encoder:mp3.encoder });
    let video = null, videoErr = null;
    if(canRenderOffline()){
      try{ video = await renderVideoOffline(pcm, info, events, track, p=>emit(0.16 + 0.84*p), opts.enc || null, opts.maxVideoWidth); }
      catch(err){ videoErr = String(err && err.message || err); }
    }
    const out = { style:info.style, seed:info.seed, id, duration:info.duration, exact:img.exact,
                  metrics:info.metrics, mp3:mp3.blob, mp3Encoder:mp3.encoder, video, videoErr };
    if(!video) Object.assign(out, { needsRealtime:true, pcmL:pcm.L, pcmR:pcm.R, sampleRate:pcm.sampleRate,
                                    events, track, image:info.image });
    return out;
  }

  return { run, prepareJob, audioJob, segmentJob, muxParallel, videoBitrateFor, MAX_VIDEO_BYTES, videoDims, pickVideoConfig, decodeImage, analyze, synthesize, encodeMp3, renderVideoOffline, renderVideoRealtime, canRenderOffline, DM, SR };
})();
