<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/tools/yekta-light/assets/fonts/inter.woff2) format('woff2')}
:root{--bg:#0c0c0d;--panel:#141415;--surface:#1b1b1d;--surface2:#232326;--fg:#ebe8e2;--mute:#8a8780;--line:#2b2b2f;--amber:#f3b44a;--on-amber:#1a1408;--r:12px;--panel-w:384px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{color:var(--fg);font:400 13px/1.45 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* top bar */
.top{flex:none;height:52px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px 3px rgba(243,180,74,.5)}
.logo b{font-weight:800;letter-spacing:.2em;font-size:14px}
.logo span{font-weight:300;color:var(--mute);font-size:14px}
.crumb{color:var(--mute);font-size:12px;display:flex;gap:8px;align-items:center}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--fg)}
.top .sp{flex:1}
.top .free{border:1px solid rgba(243,180,74,.5);color:var(--amber);border-radius:999px;padding:3px 10px;font-size:11px}

/* layout: model left, tools right */
.app{flex:1;min-height:0;display:flex}
.stage{position:relative;flex:1;min-width:0;background:#0f0f10}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{flex:none;width:var(--panel-w);border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}

/* viewport overlays */
.ov{position:absolute;display:flex;gap:6px;align-items:center;pointer-events:none}
.ov>*{pointer-events:auto}
.ov.tl{left:62px;top:14px;flex-wrap:wrap;max-width:calc(100% - 28px)}
.ov.bl{left:14px;bottom:14px;color:var(--mute);font-size:12px;pointer-events:none;max-width:calc(100% - 360px)}
@media (max-width:1180px){.ov.bl{display:none}}
.ov.br{right:14px;bottom:14px}
.seg{display:flex;background:rgba(20,20,21,.86);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{padding:5px 11px;border-radius:999px;color:var(--mute);font-size:12px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface2);color:var(--fg)}
.seg button.amber.on{background:var(--amber);color:var(--on-amber)}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--mute);font-size:12px;letter-spacing:.12em;text-transform:uppercase;background:#0f0f10;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
.loading .bar{width:180px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.loading .bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
.loupe{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.5);pointer-events:none;display:none;transform:translate(-50%,-130%)}

.toolbar{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;background:rgba(20,20,21,.86);border:1px solid var(--line);border-radius:12px;padding:4px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2}
.toolbar button{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.toolbar button:hover{color:var(--fg);background:var(--surface2)}
.toolbar button.on{background:var(--amber);color:var(--on-amber)}
.toolbar i{height:1px;background:var(--line);margin:4px 4px}
.body.handmap{aspect-ratio:1}
.body.handmap .jd{width:11px;height:11px;margin:-5.5px 0 0 -5.5px}
.body .cap2{position:absolute;left:10px;top:8px;color:var(--mute);font-size:11px}
.body .jd.pin{border-color:#5fb3ff}

/* picked color + palette (always visible) */
.pickbox{flex:none;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.pick{display:flex;gap:12px;align-items:center}
.pick .sw{width:56px;height:56px;border-radius:10px;border:1px solid rgba(255,255,255,.08);flex:none}
.pick .info{flex:1;min-width:0}
.pick .hx{font:600 18px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.pick .sub{color:var(--mute);font-size:11px;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--fg);background:var(--surface)}
.btn:hover{border-color:#45454b}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--on-amber);font-weight:600}
.fam{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:12px}
.fam button{aspect-ratio:1;border-radius:6px;border:1px solid rgba(255,255,255,.06);position:relative}
.fam button:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.35)}
.famlbl{display:flex;justify-content:space-between;color:var(--mute);font-size:10px;margin-top:4px;letter-spacing:.04em}
.ramp{display:flex;height:14px;border-radius:5px;overflow:hidden;margin-top:10px}
.ramp button{flex:1;height:100%}
.hist{display:flex;gap:4px;margin-top:10px;min-height:16px;flex-wrap:wrap}
.hist button{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.06)}

/* tabs */
.tabs{flex:none;display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{flex:1;padding:11px 0 10px;color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-color:var(--amber)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px 28px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.pane{display:none}.pane.on{display:block}
h3{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between}
h3 .r{color:var(--mute);letter-spacing:.04em;text-transform:none;font-weight:400;font-size:11px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}
.row>label{width:84px;flex:none;color:var(--mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:#cfccc6;font-size:12px;background:var(--surface)}
.chip:hover{border-color:#45454b;color:var(--fg)}
.chip.on{border-color:var(--amber);color:var(--amber)}

/* slider */
.sl{flex:1;position:relative;height:22px;display:flex;align-items:center;cursor:ew-resize;touch-action:none}
.sl .tr{position:absolute;left:0;right:0;height:3px;border-radius:3px;background:var(--line)}
.sl .fi{position:absolute;height:3px;border-radius:3px;background:var(--amber)}
.sl .kn{position:absolute;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.sl:hover .kn{transform:scale(1.15)}
.val{width:44px;flex:none;text-align:right;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfccc6;background:none;border:0;padding:2px 0}
.val:focus{outline:1px solid var(--line);border-radius:4px;color:var(--fg)}
input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.toggle{position:relative;width:32px;height:18px;border-radius:999px;background:var(--line);flex:none;transition:background .2s}
.toggle::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .2s}
.toggle.on{background:var(--amber)}.toggle.on::after{transform:translateX(14px);background:var(--on-amber)}

/* light ball */
.lightwrap{display:flex;gap:14px;align-items:center}
.ball{width:150px;height:150px;flex:none;touch-action:none;cursor:crosshair;border-radius:50%}
.lightwrap .side{flex:1;display:flex;flex-direction:column;gap:6px}
.note{color:var(--mute);font-size:11px;line-height:1.5;margin-top:6px}

/* pose: body map */
.body{position:relative;width:100%;aspect-ratio:1.25;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.body svg{position:absolute;inset:0;width:100%;height:100%}
.body .jd{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--mute);background:var(--bg)}
.body .jd:hover{border-color:var(--fg)}
.body .jd.on{border-color:var(--amber);background:var(--amber);box-shadow:0 0 10px rgba(243,180,74,.6)}
.body .jd.set::after{content:'';position:absolute;right:-5px;top:-5px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.body .cap{position:absolute;left:12px;top:10px;font-weight:600;font-size:13px}
.body .hint{position:absolute;left:12px;bottom:9px;right:12px;color:var(--mute);font-size:10.5px}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kbd{font:10px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--mute)}
.foot{color:var(--mute);font-size:11px;margin-top:22px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.foot a{color:#cfccc6}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--fg);color:#111;padding:8px 14px;border-radius:999px;font-weight:600;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute)}

@media (max-width:900px){
  body{overflow:auto;height:auto}
  .app{flex-direction:column}
  .stage{height:62vh;min-height:360px;flex:none}
  .panel{width:100%;border-left:0;border-top:1px solid var(--line)}
  .scroll{overflow:visible}
  .crumb{display:none}
  .ov.tl{left:10px;top:10px}
}
@media (max-width:420px){.ball{width:124px;height:124px}.top .free{display:none}}
</style>
</head>
