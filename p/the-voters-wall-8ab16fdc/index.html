<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noimageindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Voters' Wall · CHECKMEME</title>
<meta name="description" content="Every voter who backed CHECKMEME | The Move, pinned to the wall.">
<style>
@font-face{font-family:Caslon;src:url(assets/libre-caslon-text-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Caslon;src:url(assets/libre-caslon-text-latin-400-italic.woff2) format('woff2');font-weight:400;font-style:italic}
@font-face{font-family:Caslon;src:url(assets/libre-caslon-text-latin-700-normal.woff2) format('woff2');font-weight:700}
:root{--ink:#2a1701;--paper-hi:#e8d9b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0806;overscroll-behavior:none}
body{font-family:Caslon,Georgia,serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#view.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;width:3200px;height:2000px;transform-origin:0 0;background:url(assets/scene.webp) 0 0/100% 100% no-repeat;will-change:transform}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 85% at 50% 42%,rgba(0,0,0,0) 55%,rgba(5,3,1,.6))}
/* the sign */
.label{position:absolute;background:url(assets/label.webp) center/100% 100% no-repeat;filter:drop-shadow(8px 22px 18px rgba(0,0,0,.6));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-1.2deg)}
.label h1{margin:0;font:700 var(--h1,100px)/1 Caslon,serif;letter-spacing:.02em;color:#3b2508;text-shadow:0 2px 0 rgba(255,240,210,.5),0 -2px 0 rgba(60,30,0,.35)}
.label .rule{width:62%;height:4px;margin:var(--rm,18px) 0;background:linear-gradient(90deg,transparent,#5a3a12 15%,#5a3a12 85%,transparent);opacity:.7}
.label h2{margin:0;font:700 var(--h2,40px)/1 Caslon,serif;letter-spacing:.26em;color:#4a2e0b}
/* papers */
.note{position:absolute;display:block;aspect-ratio:595/720;transform:rotate(var(--r));filter:drop-shadow(7px 18px 12px rgba(0,0,0,.6));cursor:pointer;transition:transform .35s cubic-bezier(.2,1.4,.4,1),filter .35s}
.note:hover{transform:rotate(calc(var(--r) * .3)) scale(1.05) translateY(-8px);filter:drop-shadow(12px 34px 22px rgba(0,0,0,.6));z-index:3}
.note .pp{position:absolute;inset:0;background:var(--paper) center/100% 100% no-repeat}
.note .ph{position:absolute;left:19%;right:19%;top:16.5%;aspect-ratio:1;overflow:hidden}
.note .ph img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;filter:sepia(.28) contrast(1.06) saturate(.9);pointer-events:none}
.note .sh{position:absolute;inset:0;background:var(--shade) center/100% 100% no-repeat;mix-blend-mode:multiply;opacity:.85}
.note .nm{position:absolute;left:10%;right:10%;top:72%;text-align:center;font-weight:700;line-height:1.1;color:var(--ink);mix-blend-mode:multiply;white-space:nowrap}
.note .nm::before{content:"@";font-weight:400;opacity:.55;margin-right:.06em}
/* the king */
#king{position:absolute;cursor:pointer}
#king img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;pointer-events:none;filter:drop-shadow(0 0 0 rgba(255,220,150,0));transition:filter .4s}
#king:hover img,#king.on img{filter:drop-shadow(0 0 22px rgba(255,214,140,.55))}
#king .sd{position:absolute;left:8%;right:8%;bottom:-3%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),rgba(0,0,0,0));pointer-events:none}
#king.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-4%)}100%{transform:translateY(0)}}
/* the bubble: the same paper bubble the white pieces use in the painting */
.bubble{position:fixed;left:0;top:0;max-width:min(330px,80vw);min-width:140px;pointer-events:none;opacity:0;transition:opacity .16s;z-index:10}
.bubble.show{opacity:1}
.bubble .bin{position:relative;padding:20px 20px 16px;transform-origin:var(--ox,50%) 100%}
.bubble.show .bin{animation:bubPop .42s cubic-bezier(.2,1.7,.4,1) both}
@keyframes bubPop{0%{transform:scale(.45) rotate(-4deg)}100%{transform:none}}
.bubble svg.bg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.6)) drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.bubble svg.bg path{filter:url(#bubRough)}
.bubble .ink{stroke:#1a1108;stroke-width:2.8;stroke-linejoin:round}
.bubble .txt{position:relative;font:400 17px/1.42 Caslon,Georgia,serif;color:var(--ink);white-space:pre-wrap}
.bubble .who{position:absolute;left:14px;top:-10px;font:700 10.5px/1 Caslon,serif;letter-spacing:.16em;text-transform:uppercase;padding:5px 8px 4px;border-radius:1px;white-space:nowrap;transform:rotate(-2deg);box-shadow:2px 2px 0 rgba(0,0,0,.5);background:var(--ink);color:var(--paper-hi)}
.caret{display:inline-block;width:.5em;height:1em;margin-left:1px;vertical-align:-2px;background:currentColor;opacity:.55;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* little controls */
#ui{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:11}
#ui button{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(232,217,178,.55);background:rgba(20,13,6,.72);color:#e8d9b2;font:700 22px/1 Caslon,serif;cursor:pointer;display:grid;place-items:center;padding:0;backdrop-filter:blur(4px)}
#ui button:hover{background:rgba(60,40,15,.85)}
#hint{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:11;color:#e8d9b2;font:italic 400 17px/1.3 Caslon,serif;text-shadow:0 2px 6px #000;pointer-events:none;transition:opacity .8s;white-space:nowrap}
#hint.off{opacity:0}
#credit{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:11;color:#cdb684;font:italic 400 13px/1.4 Caslon,serif;text-shadow:0 1px 4px #000;opacity:.85}
#credit a{color:#ffdf9a}
@media (max-width:600px){#credit{display:none}#hint{font-size:15px}}
@media (max-height:520px){#credit{display:none}#hint{bottom:auto;top:max(12px,env(safe-area-inset-top));font-size:15px}#ui button{width:38px;height:38px;font-size:19px}#ui{gap:6px}}
/* older browsers (Safari 14 and earlier): same layout without inset / aspect-ratio */
#view,#vig{top:0;right:0;bottom:0;left:0}
.note .pp,.note .sh{top:0;right:0;bottom:0;left:0}
#ui button{-webkit-backdrop-filter:blur(4px)}
/* phones and tablets: each paper is flattened into one picture (no live blend modes or filters), so iPhone Safari stays light */
.lite .note{filter:none;transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.lite .note:hover{filter:none}
.lite .note.baked>.pp,.lite .note.baked>.ph,.lite .note.baked>.sh,.lite .note.baked>.nm{display:none}
.note canvas.bk{position:absolute;pointer-events:none}
</style>
</head>
