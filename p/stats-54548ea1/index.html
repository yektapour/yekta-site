<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://yektapour.goatcounter.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0d0d">
<title>Stats | YEKTA</title>
<link rel="icon" href="/favicon.ico">
<link rel="preload" href="/font/geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/font/clash-display.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Geist';font-weight:100 900;font-display:swap;src:url(/font/geist.woff2) format('woff2')}
@font-face{font-family:'Clash Display';font-weight:200 700;font-display:swap;src:url(/font/clash-display.woff2) format('woff2')}
:root{--bg:#0d0d0d;--card:#141414;--line:#232323;--fg:#ece8e1;--mute:#8a8780;--dim:#55534f;--red:#e3141f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg)}
body{font:400 14px/1.5 'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:40px 32px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line)}
.k{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
h1{font:600 clamp(40px,6vw,72px)/.95 'Clash Display',sans-serif;letter-spacing:-.01em;margin-top:14px}
h1 i{font-style:normal;color:var(--red)}
.ranges{display:flex;gap:4px;flex-wrap:wrap}
.ranges button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--mute);transition:.25s}
.ranges button:hover{color:var(--fg);border-color:#3a3a3a}
.ranges button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.kpi{padding:28px 24px 28px 0}
.kpi+.kpi{padding-left:24px;border-left:1px solid var(--line)}
.kpi b{display:block;font:600 clamp(34px,4.4vw,58px)/1 'Clash Display',sans-serif;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b.s{font-size:clamp(20px,2.2vw,28px);line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kpi small{display:block;color:var(--mute);margin-top:8px;font-size:12px}
.chart{position:relative;padding:36px 0 8px;border-bottom:1px solid var(--line)}
.chart .k{margin-bottom:18px}
svg.c{display:block;width:100%;height:260px;overflow:visible}
svg.c .g{stroke:var(--line);stroke-width:1}
svg.c .ax{fill:var(--dim);font-size:11px;font-family:'Geist',sans-serif}
svg.c .th{fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.8s cubic-bezier(.6,0,.2,1) forwards}
svg.c .ar{fill:url(#fade);opacity:0;animation:fade 1.2s .9s forwards}
svg.c .dt{fill:var(--bg);stroke:var(--red);stroke-width:2;opacity:0;transition:opacity .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .15s}
.tip b{font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.panel{padding:36px 0 8px;border-bottom:1px solid var(--line)}
.panel.wide{grid-column:1/-1}
.panel .k{margin-bottom:18px;display:flex;justify-content:space-between}
.panel .k span{letter-spacing:.1em}
ol{list-style:none}
li.r{position:relative;display:flex;justify-content:space-between;gap:16px;padding:11px 0 13px;font-size:14px}
li.r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
li.r .n em{font-style:normal;color:var(--dim);margin-left:8px;font-size:12px}
li.r .v{color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
li.r .v i{font-style:normal;color:var(--dim);margin-left:10px;font-size:12px;display:inline-block;min-width:36px;text-align:right}
li.r::before,li.r::after{content:'';position:absolute;left:0;bottom:4px;height:2px;border-radius:2px}
li.r::before{right:0;background:var(--line);height:1px;bottom:4.5px}
li.r::after{background:var(--red);width:0;transition:width 1.1s cubic-bezier(.6,0,.2,1)}
li.r.on::after{width:var(--w)}
.empty{color:var(--dim);padding:10px 0 18px}
.more{background:none;border:0;color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px 0 16px;cursor:pointer}
.more:hover{color:var(--fg)}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:28px;color:var(--dim);font-size:12px}
footer button{background:none;border:0;color:var(--dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
footer button:hover{color:var(--fg)}
.gate{min-height:100vh;display:grid;place-items:center;padding:32px}
.gate form{width:min(440px,100%)}
.gate p{color:var(--mute);margin:18px 0 26px}
.gate input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;outline:none}
.gate input:focus{border-color:var(--red)}
.gate button{margin-top:12px;width:100%;background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:14px;font-weight:600;cursor:pointer}
.gate .err{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}
.load{opacity:.35;transition:opacity .3s}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){padding-left:0;border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}.grid{grid-template-columns:1fr}}
@media (max-width:520px){.wrap{padding:28px 16px 60px}svg.c{height:200px}.kpi{padding:22px 12px 22px 0}.kpi+.kpi{padding-left:12px}.kpi:nth-child(3){padding-left:0}}
</style>
</head>
<body>
<div id="app"></div>
<script src="stats.js"></script>
</body>
</html>
